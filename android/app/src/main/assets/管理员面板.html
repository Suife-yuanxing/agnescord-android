<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>开发者面板 — UI 原型</title>
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/base.css">
<link rel="stylesheet" href="shared/components.css">
<link rel="stylesheet" href="shared/effects.css">
<link rel="stylesheet" href="shared/pages/admin.css">
</head>
<body>

<div class="phone" data-emotion="1">
  <!-- Title Bar — 深色区分管理模式 -->
  <div class="title-bar" style="background: linear-gradient(135deg, #1A1A2E 0%, #16213E 50%, #1A1A2E 100%);">
    <a class="back" href="index.html" style="color:rgba(255,255,255,0.85);">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <span class="title" style="color:rgba(255,255,255,0.92); font-weight:700; letter-spacing:0.5px;">开发者面板</span>
    <span style="width:44px;flex-shrink:0;"></span>
  </div>

  <!-- Tab Row (Phase 2) -->
  <div class="admin-tab-row">
    <button class="admin-tab-btn active" onclick="switchAdminTab('overview',this)">概览</button>
    <button class="admin-tab-btn" onclick="switchAdminTab('users',this)">用户</button>
    <button class="admin-tab-btn" onclick="switchAdminTab('bots',this)">Bot</button>
    <button class="admin-tab-btn" onclick="switchAdminTab('backup',this)">备份</button>
    <button class="admin-tab-btn" onclick="switchAdminTab('logs',this)">日志</button>
  </div>

  <div class="scroll-area">

    <!-- Tab: 概览 -->
    <div class="admin-tab-panel active" id="tabPanel-overview">
    <!-- 系统健康四格 -->
    <div class="health-row">
      <div class="health-card">
        <div class="hc-head">
          <div class="hc-icon cpu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/></svg>
          </div>
          <span class="hc-label">CPU 利用率</span>
        </div>
        <div class="hc-value" data-metric="cpu">--<span style="font-size:14px;font-weight:600;color:var(--text-secondary);">%</span></div>
        <div class="hc-bar-wrap"><div class="hc-bar-fill cpu" style="width:0%;"></div></div>
        <div class="hc-sub">加载中…</div>
      </div>
      <div class="health-card">
        <div class="hc-head">
          <div class="hc-icon ram">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="2" y="6" width="20" height="12" rx="2"/><line x1="6" y1="10" x2="6" y2="14"/><line x1="9" y1="10" x2="9" y2="14"/><line x1="12" y1="10" x2="12" y2="14"/></svg>
          </div>
          <span class="hc-label">内存使用</span>
        </div>
        <div class="hc-value" data-metric="mem">--<span style="font-size:14px;font-weight:600;color:var(--text-secondary);">/-- GB</span></div>
        <div class="hc-bar-wrap"><div class="hc-bar-fill ram" style="width:0%;"></div></div>
        <div class="hc-sub">加载中…</div>
      </div>
    </div>
    <div class="health-row" style="margin-top:8px;">
      <div class="health-card">
        <div class="hc-head">
          <div class="hc-icon bw">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10"/><path d="M12 2a15.3 15.3 0 00-4 10 15.3 15.3 0 004 10"/></svg>
          </div>
          <span class="hc-label">公网带宽</span>
        </div>
        <div class="hc-value" data-metric="bw">--<span style="font-size:14px;font-weight:600;color:var(--text-secondary);">/-- Mbps</span></div>
        <div class="hc-bar-wrap"><div class="hc-bar-fill bw" style="width:0%;"></div></div>
        <div class="hc-sub">加载中…</div>
      </div>
      <div class="health-card">
        <div class="hc-head">
          <div class="hc-icon ws">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
          </div>
          <span class="hc-label">WS 连接</span>
        </div>
        <div class="hc-value" data-metric="ws">--<span style="font-size:14px;font-weight:600;color:var(--text-secondary);"> 活跃</span></div>
        <div class="hc-bar-wrap"><div class="hc-bar-fill ws" style="width:0%;"></div></div>
        <div class="hc-sub">加载中…</div>
      </div>
    </div>

    <!-- 快捷操作 -->
    <div class="quick-actions">
      <button class="qa-btn" onclick="doCreateBackup()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        一键备份
      </button>
      <button class="qa-btn" onclick="doLogSnapshot()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        日志快照
      </button>
      <button class="qa-btn" onclick="doResetStats()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
        重置统计
      </button>
      <button class="qa-btn caution" onclick="showRestoreSheet()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        恢复备份
      </button>
    </div>

    </div><!-- /tab: 概览 -->

    <!-- Tab: 用户 -->
    <div class="admin-tab-panel" id="tabPanel-users">
    <!-- 全部用户 -->
    <div class="section-header">
      <div class="sh-title">
        <div class="sh-icon users">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4-4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
        </div>
        全部用户
      </div>
      <div class="sh-count" id="userCountBadge">加载中…</div>
    </div>
    <div class="table-card" data-table="users">
      <table>
        <thead>
          <tr><th>用户</th><th>手机号</th><th>Bot</th><th>消息</th><th>角色</th><th>注册日期</th></tr>
        </thead>
        <tbody id="usersTbody">
          <tr><td colspan="6" style="text-align:center;padding:20px;color:#B090A0;">加载中…</td></tr>
        </tbody>
      </table>
    </div>
    </div><!-- /tab: 用户 -->

    <!-- Tab: Bot -->
    <div class="admin-tab-panel" id="tabPanel-bots">
    <!-- 全部 Bot -->
    <div class="section-header">
      <div class="sh-title">
        <div class="sh-icon bots">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="3" y="11" width="18" height="10" rx="3"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="16" y2="16"/><line x1="8" y1="19" x2="12" y2="19"/></svg>
        </div>
        全部 Bot
      </div>
      <div class="sh-count" id="botCountBadge">加载中…</div>
    </div>
    <div class="table-card">
      <table>
        <thead>
          <tr><th>Bot 名</th><th>创建者</th><th>人格</th><th>消息</th><th>状态</th><th>创建</th></tr>
        </thead>
        <tbody id="botsTbody">
          <tr><td colspan="6" style="text-align:center;padding:20px;color:#B090A0;">加载中…</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Token 排行 -->
    <div class="section-header">
      <div class="sh-title">
        <div class="sh-icon tokens">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
        </div>
        Token 消耗排行
      </div>
      <div class="sh-count">本月</div>
    </div>
    <div class="table-card" style="padding:6px 16px 8px;" data-container="tokens-ranking">
      <div class="token-item"><span style="color:var(--text-secondary);font-size:13px;padding:12px 0;display:block;text-align:center;">加载中…</span></div>
      <div class="token-summary" data-container="tokens-summary">加载中…</div>
    </div>
    </div><!-- /tab: Bot -->

    <!-- Tab: 备份 -->
    <div class="admin-tab-panel" id="tabPanel-backup">
    <!-- 备份管理 -->
    <div class="section-header">
      <div class="sh-title">
        <div class="sh-icon backup">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.66 3.58 3 8 3s8-1.34 8-3V6"/><path d="M4 12v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6"/></svg>
        </div>
        备份管理
      </div>
      <div class="sh-count" data-container="backups-count">--</div>
    </div>
    <div data-container="backups" style="padding:0 16px;">
      <div class="backup-card"><div class="backup-info"><div class="bi-name">加载中…</div></div></div>
    </div>
    <div style="padding:8px 16px 16px;display:flex;gap:8px;">
      <button class="ba-btn" onclick="doCreateBackup()" style="padding:10px 18px;background:var(--color-primary,#F472B6);color:#fff;border:none;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;">一键备份</button>
      <button class="ba-btn caution" onclick="doLogSnapshot()" style="padding:10px 18px;background:var(--color-warning,#FBBF24);color:#1a1a2e;border:none;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;">日志快照</button>
    </div>
    </div><!-- /tab: 备份 -->

    <!-- Tab: 日志 -->
    <div class="admin-tab-panel" id="tabPanel-logs">
    <!-- 系统日志 -->
    <div class="section-header">
      <div class="sh-title">
        <div class="sh-icon logs">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        </div>
        系统日志
      </div>
      <div class="sh-count">脱敏</div>
    </div>
    <div class="log-filters">
      <button class="log-filter active" onclick="filterLogs('all', this)">全部</button>
      <button class="log-filter" onclick="filterLogs('info', this)">INFO</button>
      <button class="log-filter" onclick="filterLogs('warn', this)">WARN</button>
      <button class="log-filter" onclick="filterLogs('error', this)">ERROR</button>
      <button class="log-filter" onclick="filterLogs('debug', this)">DEBUG</button>
    </div>
    <div class="log-card" id="logContainer" data-container="logs">
      <div class="log-line"><span style="color:var(--text-secondary);font-size:13px;">加载中…</span></div>
    </div>
    </div><!-- /tab: 日志 -->

  </div><!-- /scroll-area -->

  <!-- Toast -->
  <div id="toast" class="toast"></div>
</div>

<!-- 恢复备份选择弹窗 -->
<div class="modal-overlay hidden" id="restoreSheet">
  <div class="modal-sheet">
    <div class="modal-title">选择要恢复的备份</div>
    <div id="restoreList" style="max-height:300px;overflow-y:auto;"></div>
    <button class="modal-cancel" onclick="closeRestoreSheet()">取消</button>
  </div>
</div>

<script src="shared/native.js"></script>
<script src="shared/config.js"></script>
<script src="shared/api.js"></script>
<script src="shared/app.js"></script>
<script src="shared/pages/admin.js"></script>

</body>
</html>
