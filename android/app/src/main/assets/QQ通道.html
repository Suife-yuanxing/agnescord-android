<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">

<style>
/* ===== QQ 通道 — 页面专属样式 ===== */
.scroll-area { padding: 12px 0 8px; }
/* P6：与其他页面相同的顶部间距（由 base.css 统一管理） */

/* 连接状态卡片 */
.status-card {
  margin: 8px 20px; padding: 18px 16px;
  background: linear-gradient(135deg, #4CAF50 0%, #66BB6A 50%, #81C784 100%);
  border-radius: 18px; color: #fff;
  box-shadow: 0 8px 24px rgba(76,175,80,0.25);
  display: flex; align-items: center; gap: 14px;
  position: relative; overflow: hidden;
}
.status-card::after {
  content: ''; position: absolute; top: -30%; left: -30%;
  width: 80%; height: 100%;
  background: radial-gradient(ellipse, rgba(255,255,255,0.12) 0%, transparent 70%);
  pointer-events: none;
}
.status-card .sc-icon {
  width: 44px; height: 44px; border-radius: 50%;
  background: rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center;
  position: relative; z-index: 1;
}
.status-card .sc-icon svg { width: 26px; height: 26px; }
.status-card .sc-info { position: relative; z-index: 1; }
.status-card .sc-label { font-size: 13px; font-weight: 700; }
.status-card .sc-detail { font-size: 11px; opacity: 0.8; margin-top: 2px; }
.status-card .sc-badge {
  position: relative; z-index: 1; margin-left: auto;
  background: rgba(255,255,255,0.2); border: 1.5px solid rgba(255,255,255,0.3);
  padding: 6px 14px; border-radius: 12px;
  font-size: 12px; font-weight: 700;
}

/* 信息卡片 */
.info-card {
  margin: 6px 20px; padding: 16px;
  background: rgba(255,255,255,0.7); backdrop-filter: blur(8px);
  border-radius: 18px;
  border: 1.5px solid rgba(255,255,255,0.7);
  box-shadow: 0 3px 12px rgba(100,100,120,0.05);
}
.info-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0;
}
.info-row + .info-row { border-top: 1px solid rgba(0,0,0,0.04); }
.info-row .ir-label { font-size: 13px; color: #B090A0; }
.info-row .ir-value { font-size: 13px; font-weight: 700; color: #3A2030; display: flex; align-items: center; gap: 6px; }
.info-row .ir-value .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.info-row .ir-value .dot.green { background: #4CAF50; }

/* Mini stat grid */
.stat-mini-row { display: flex; gap: 10px; margin: 6px 20px; }
.stat-mini {
  flex: 1; background: rgba(255,255,255,0.7); backdrop-filter: blur(8px);
  border-radius: 16px; padding: 12px; text-align: center;
  border: 1.5px solid rgba(255,255,255,0.7);
  box-shadow: 0 3px 12px rgba(100,100,120,0.05);
}
.stat-mini .sm-value { font-size: 20px; font-weight: 800; }
.stat-mini .sm-label { font-size: 11px; color: #B090A0; margin-top: 2px; }
.sm-green { color: #4CAF50; }
.sm-pink { color: #F472B6; }

/* Danger zone */
.danger-zone { margin: 16px 20px; }
.danger-btn {
  width: 100%; padding: 14px; border-radius: 16px;
  background: rgba(255,255,255,0.7); backdrop-filter: blur(8px);
  color: #F472B6; border: 1.5px solid rgba(244, 114, 182,0.2);
  font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer;
  transition: all 0.25s;
}
.danger-btn:hover { background: #F472B6; color: #fff; border-color: #F472B6; }
.danger-btn:active { transform: scale(0.97); }

/* ===== Dark Mode ===== */
.phone.dark-mode .status-card { box-shadow: 0 8px 24px rgba(76,175,80,0.15); }
.phone.dark-mode .info-card { background: #16213E; border-color: rgba(255,255,255,0.06); }
.phone.dark-mode .info-row .ir-label { color: #8078A0; }
.phone.dark-mode .info-row .ir-value { color: #E0D8E8; }
.phone.dark-mode .info-row + .info-row { border-top-color: rgba(255,255,255,0.04); }
.phone.dark-mode .stat-mini { background: #16213E; border-color: rgba(255,255,255,0.06); }
.phone.dark-mode .stat-mini .sm-label { color: #8078A0; }
.phone.dark-mode .danger-btn { background: #16213E; border-color: rgba(244, 114, 182,0.2); }
.phone.dark-mode .danger-btn:hover { background: #F472B6; }
</style>

<script>
// 自定义确认弹窗（替代原生 confirm）
function showConfirmDialog(title, desc, onConfirm, confirmText) {
  var overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  overlay.innerHTML = '<div class="confirm-dialog">' +
    '<div class="confirm-dialog-title">' + title + '</div>' +
    '<div class="confirm-dialog-desc">' + desc + '</div>' +
    '<div class="confirm-dialog-actions">' +
      '<button class="cd-cancel confirm-btn-cancel">取消</button>' +
      '<button class="cd-confirm confirm-btn-ok">' + (confirmText || '确认') + '</button>' +
    '</div></div>';
  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) { overlay.remove(); return; }
    if (e.target.classList.contains('cd-cancel')) { overlay.remove(); return; }
    if (e.target.classList.contains('cd-confirm')) { overlay.remove(); if (onConfirm) onConfirm(); }
  });
  document.getElementById('phoneFrame').appendChild(overlay);
}

function handleDisconnect() {
  showConfirmDialog('断开 QQ 通道', 'Bot 将停止响应 QQ 消息，确定断开吗？', function() {
    var btn = document.getElementById('disconnectBtn');
    btn.disabled = true; btn.textContent = '断开中...';
    API.disconnectQQ().then(function(r){
      showToast('QQ 通道已断开', 'error');
      var sc = document.querySelector('.status-card');
      sc.style.background = 'linear-gradient(135deg, #B0A8C0 0%, #C8C0D8 50%, #D8D0E8 100%)';
      sc.querySelector('.sc-label').textContent = '已断开';
      sc.querySelector('.sc-detail').textContent = 'QQ 通道未连接';
      sc.querySelector('.sc-badge').textContent = '离线';
      btn.textContent = '已断开';
    }).catch(function(e){
      showToast('断开失败: ' + e.message, 'error');
      btn.disabled = false; btn.textContent = '断开连接';
    });
  }, '断开连接');
}

// 后端配置引导 — 当接口不可用时显示
function showBackendGuidance(channel, errMsg) {
  var existing = document.getElementById('backendGuidance');
  if (existing) existing.remove();
  var serverBase = (window.APP_CONFIG && window.APP_CONFIG.server_base) || '未配置';
  var guidance = document.createElement('div');
  guidance.id = 'backendGuidance';
  guidance.className = 'guidance-card';
  guidance.innerHTML = '<div class="guidance-header">' +
    '<div class="icon-circle-sm">' +
    '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#FF6B6B" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' +
    '</div>' +
    '<div class="guidance-title">' + channel + ' 通道服务不可用</div>' +
    '</div>' +
    '<div class="guidance-body">' +
    '<div style="margin-bottom:6px;">错误详情: <span class="error-detail">' + (errMsg || '').replace(/</g,'&lt;') + '</span></div>' +
    '<div>请检查后端服务是否已部署 ' + channel + ' 通道模块：</div>' +
    '<div class="code-block">' +
    '1. 后端服务地址: <span class="code-highlight">' + serverBase + '</span><br>' +
    '2. 检查端点 <span class="code-highlight">/api/v1/channel/' + channel.toLowerCase() + '/status</span> 是否可用<br>' +
    '3. 确认后端 ' + channel + ' 通道插件已安装并配置正确<br>' +
    '4. 查看后端日志排查具体错误原因' +
    '</div>' +
    '</div>';
  var scrollArea = document.querySelector('.scroll-area');
  if (scrollArea) {
    var dangerZone = scrollArea.querySelector('.danger-zone');
    if (dangerZone) {
      scrollArea.insertBefore(guidance, dangerZone);
    } else {
      scrollArea.appendChild(guidance);
    }
  }
}
</script>

<script>
// Load QQ channel status
if (API.isLoggedIn()) {
  function loadQQStatus() {
    API.getQQStatus().then(function(qq) {
      var statusEl = document.querySelector('[data-qq-status]');
      if (statusEl) {
        statusEl.textContent = qq.connected ? '已连接' : '未连接';
      }
      // 更新状态卡片颜色和详情
      var sc = document.querySelector('.status-card');
      if (sc) {
        if (qq.connected) {
          sc.style.background = 'linear-gradient(135deg, #4CAF50 0%, #66BB6A 50%, #81C784 100%)';
          var detailEl = sc.querySelector('.sc-detail');
          if (detailEl) detailEl.textContent = 'QQ Bot · 运行正常';
        } else {
          sc.style.background = 'linear-gradient(135deg, #B0A8C0 0%, #C8C0D8 50%, #D8D0E8 100%)';
          var detailEl = sc.querySelector('.sc-detail');
          if (detailEl) detailEl.textContent = 'QQ 通道未连接';
        }
      }
      var badge = sc && sc.querySelector('.sc-badge');
      if (badge) badge.textContent = qq.connected ? '在线' : '离线';
      var qqNumEl = document.querySelector('[data-qq-number]');
      if (qqNumEl && qq.qq_number) qqNumEl.textContent = qq.qq_number;
      // 连接时间
      var ctEl = document.querySelector('[data-qq-connect-time]');
      if (ctEl && qq.connected_at) {
        ctEl.textContent = new Date(qq.connected_at * 1000).toLocaleString('zh-CN', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
      }
      // 心跳状态
      var hbEl = document.querySelector('[data-qq-heartbeat]');
      if (hbEl) {
        hbEl.innerHTML = qq.connected ? '<span class="dot green"></span>正常' : '--';
      }
    }).catch(function(err) {
      var errMsg = err.message || '未知错误';
      console.error('[QQ] status error:', errMsg, err);
      // 显示实际错误信息
      var statusEl = document.querySelector('[data-qq-status]');
      if (statusEl) statusEl.textContent = '服务异常';
      var sc = document.querySelector('.status-card');
      if (sc) {
        sc.style.background = 'linear-gradient(135deg, #FF6B6B 0%, #FF8E8E 50%, #FFB4B4 100%)';
        var detailEl = sc.querySelector('.sc-detail');
        if (detailEl) detailEl.textContent = errMsg;
      }
      var badge = sc && sc.querySelector('.sc-badge');
      if (badge) badge.textContent = '异常';
      // 显示后端配置引导
      showBackendGuidance('QQ', errMsg);
    });
    API.getQQStats().then(function(s) {
      var msgEl = document.querySelector('[data-msg-count]');
      if (msgEl) msgEl.textContent = s.message_count || 0;
      var grpEl = document.querySelector('[data-group-count]');
      if (grpEl) grpEl.textContent = s.active_groups || 0;
      var rateEl = document.querySelector('[data-success-rate]');
      if (rateEl) rateEl.textContent = (s.success_rate != null ? (s.success_rate * 100).toFixed(0) + '%' : '--');
    }).catch(function() {
      // 统计失败不影响主流程
    });
    API.getQQRecentMessages(3).then(function(d) {
      var container = document.querySelector('[data-recent-msgs]');
      if (!container) return;
      if (!d.messages || !d.messages.length) {
        container.innerHTML = '<div class="setting-item" style="margin:0;border-radius:0;background:transparent;text-align:center;padding:20px;"><div style="font-size:13px;color:#B090A0;">暂无消息</div></div>';
        return;
      }
      container.innerHTML = d.messages.map(function(m) {
        var src = escapeHtml(m.source || m.sender || '');
        var txt = escapeHtml(m.content || m.text || '');
        var t = m.time ? new Date(m.time * 1000).toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'}) : '';
        return '<div class="setting-item msg-row-flat">' +
          '<div class="avatar-circle">' + (src.charAt(0) || '?') + '</div>' +
          '<div style="flex:1;min-width:0;"><div class="msg-name">' + src + '</div>' +
          '<div class="text-ellipsis">' + txt + '</div></div>' +
          '<span class="msg-time">' + t + '</span>' +
        '</div>';
      }).join('');
    }).catch(function() {});
  }
  loadQQStatus();
  setInterval(loadQQStatus, 30000); // auto refresh every 30s
}

// 首次加载 QQ 设置（不放入 30s 轮询，避免覆盖用户操作）
function loadQQSettings() {
  if (!API.isLoggedIn()) return;
  API.getQQSettings().then(function(s) {
    if (s.auto_reply !== undefined) {
      var el = document.getElementById('qqAutoReply');
      if (el) el.checked = s.auto_reply;
    }
    if (s.group_response !== undefined) {
      var el = document.getElementById('qqGroupResponse');
      if (el) el.checked = s.group_response;
    }
    if (s.message_notify !== undefined) {
      var el = document.getElementById('qqMsgNotify');
      if (el) el.checked = s.message_notify;
    }
  }).catch(function(err) {
    console.warn('[QQ] settings load failed:', err.message || err);
    showToast('通道设置加载失败，显示的是本地缓存', 'error');
  });
}

var _qqSettingSyncing = false; // 防止 getQQSettings 覆盖正在操作的开关

function syncQQSetting(key, input, label) {
  var value = input.checked;
  showToast(label + (value ? '已开启' : '已关闭'));
  if (typeof API === 'undefined' || !API.updateQQSettings) return;
  _qqSettingSyncing = true;
  var data = {};
  data[key] = value;
  API.updateQQSettings(data).then(function() {
    _qqSettingSyncing = false;
  }).catch(function(e) {
    // 乐观更新回滚
    input.checked = !value;
    _qqSettingSyncing = false;
    showToast(label + '同步失败，已回滚: ' + e.message, 'error');
  });
}

loadQQSettings(); // 仅调用一次，不放入 setInterval
</script>
