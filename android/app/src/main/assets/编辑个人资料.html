<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>编辑个人资料 — UI 原型</title>
<link rel="stylesheet" href="shared/dist/tokens.css">
<link rel="stylesheet" href="shared/dist/base.css">
<link rel="stylesheet" href="shared/dist/components.css">
<link rel="stylesheet" href="shared/dist/anime-cat.css">
<link rel="stylesheet" href="shared/dist/effects.css">
<style>
/* ===== Page-Specific: 编辑个人资料 ===== */
/* P6：与其他页面相同的顶部间距（由 base.css 统一管理） */

/* 头像区域 */
.avatar-section {
  display: flex; flex-direction: column; align-items: center; padding: 24px 0 20px;
}
.avatar-wrap {
  width: 88px; height: 88px; border-radius: 50%; position: relative; cursor: pointer;
  background: transparent;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 16px rgba(244, 114, 182,0.15);
  transition: all 0.25s;
}
.avatar-wrap:hover { transform: scale(1.04); }
.avatar-wrap:active { transform: scale(0.96); }
.avatar-edit-badge {
  position: absolute; bottom: 2px; right: 2px;
  width: 28px; height: 28px; border-radius: 50%;
  background: #fff; color: #F472B6;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12); z-index: 5;
}
.avatar-edit-badge svg { width: 14px; height: 14px; }
.avatar-hint { font-size: 12px; color: #B090A0; margin-top: 8px; }

/* 表单区域 */
.form-section { padding: 0 20px; }
.field-group { margin-bottom: 18px; }
.field-label {
  display: block; font-size: 12px; font-weight: 700; color: #6A5060;
  margin-bottom: 6px; margin-left: 4px;
}
textarea.input-field { resize: none; height: 80px; }

/* 性别选择 */
.gender-row { display: flex; gap: 10px; }
.radio-option {
  flex: 1; padding: 14px; border-radius: 16px; text-align: center; cursor: pointer;
  background: rgba(255,255,255,0.7); border: 1.5px solid rgba(244, 114, 182,0.15);
  font-size: 14px; font-weight: 600; color: #6A5060; font-family: inherit;
  transition: all 0.25s;
}
.radio-option:hover { border-color: rgba(244, 114, 182,0.3); }
.radio-option.selected { background: rgba(244, 114, 182,0.06); border-color: #F472B6; color: #F472B6; }

/* 自定义性别 */
.gender-templates { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
.gender-tag {
  display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 12px;
  background: rgba(244,114,182,0.06); color: #F472B6;
  border: 1px solid rgba(244,114,182,0.18); cursor: pointer;
  transition: all 0.2s; font-family: inherit;
}
.gender-tag:hover { background: rgba(244,114,182,0.14); border-color: rgba(244,114,182,0.35); }
.gender-tag:active { transform: scale(0.95); }

/* Dark mode — page-specific overrides */
.phone.dark-mode .field-label { color: #B0A0C0; }
.phone.dark-mode .radio-option {
  background: #16213E; border-color: rgba(255,255,255,0.08); color: #C0B8D0;
}
.phone.dark-mode .radio-option.selected {
  background: rgba(244, 114, 182,0.15); border-color: #F472B6; color: #F472B6;
}
.phone.dark-mode .avatar-wrap { box-shadow: 0 4px 16px rgba(244, 114, 182,0.2); }
.phone.dark-mode .avatar-edit-badge { background: #16213E; color: #F472B6; }
.phone.dark-mode .avatar-hint { color: #8078A0; }
.phone.dark-mode .gender-tag { background: rgba(244, 114, 182,0.1); border-color: rgba(244, 114, 182,0.2); color: #F9A8D4; }
.phone.dark-mode .gender-tag:hover { background: rgba(244, 114, 182,0.2); }

/* ===== C2：自定义三列日期滚轮选择器 ===== */
.date-picker-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.4); display: flex; align-items: flex-end;
  animation: dp-fade-in 0.2s ease;
}
.date-picker-overlay.hidden { display: none; }
@keyframes dp-fade-in { from { opacity: 0; } to { opacity: 1; } }
.date-picker-sheet {
  width: 100%; background: #fff; border-radius: 16px 16px 0 0;
  padding-bottom: env(safe-area-inset-bottom, 20px);
  animation: dp-slide-up 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
}
@keyframes dp-slide-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
.dp-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; border-bottom: 1px solid rgba(0,0,0,0.06);
}
.dp-title { font-size: 16px; font-weight: 700; color: #3A2030; }
.dp-btn-cancel, .dp-btn-confirm {
  font-size: 14px; font-weight: 600; border: none; background: none;
  cursor: pointer; font-family: inherit; padding: 4px 8px;
}
.dp-btn-cancel { color: #B090A0; }
.dp-btn-confirm { color: #F472B6; }
.dp-columns {
  display: flex; height: 200px; overflow: hidden;
  position: relative;
}
.dp-col {
  flex: 1; overflow-y: auto; scroll-snap-type: y mandatory;
  text-align: center; font-size: 16px; padding: 80px 0;
  position: relative;
}
.dp-col .dp-item {
  height: 40px; line-height: 40px; scroll-snap-align: center;
  color: #C0A0B0; cursor: pointer;
}
.dp-col .dp-item.selected {
  color: #3A2030; font-weight: 700; font-size: 18px;
}
/* 选中行高亮遮罩 */
.dp-col::before, .dp-col::after {
  content: ''; position: absolute; left: 0; right: 0; height: 80px;
  pointer-events: none; z-index: 1;
}
.dp-col::before { top: 0; background: linear-gradient(to bottom, #fff 30%, transparent); }
.dp-col::after { bottom: 0; background: linear-gradient(to top, #fff 30%, transparent); }
.dp-col .dp-indicator {
  position: absolute; left: 10%; right: 10%; top: 50%; transform: translateY(-50%);
  height: 40px; border-top: 1px solid rgba(0,0,0,0.06); border-bottom: 1px solid rgba(0,0,0,0.06);
  pointer-events: none; z-index: 0;
}
/* dark mode */
.phone.dark-mode .date-picker-sheet { background: #1A1A2E; }
.phone.dark-mode .dp-title { color: #E0D8E8; }
.phone.dark-mode .dp-header { border-bottom-color: rgba(255,255,255,0.06); }
.phone.dark-mode .dp-col .dp-item { color: #706878; }
.phone.dark-mode .dp-col .dp-item.selected { color: #E0D8E8; }
.phone.dark-mode .dp-col::before { background: linear-gradient(to bottom, #1A1A2E 30%, transparent); }
.phone.dark-mode .dp-col::after { background: linear-gradient(to top, #1A1A2E 30%, transparent); }
.phone.dark-mode .dp-col .dp-indicator { border-color: rgba(255,255,255,0.06); }
.phone.dark-mode .dp-btn-cancel { color: #8078A0; }
</style>
</head>
<body>
<div class="phone" data-emotion="2">
  <div class="title-bar">
    <a class="back" href="我的.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <span class="title">编辑个人资料</span>
  </div>
  <div class="scroll-area">
    <!-- 头像 — v4 CSS 猫娘（Claymorphism × Macaron Pastel） -->
    <div class="avatar-section">
      <div class="avatar-wrap" id="avatarDisplay" onclick="changeAvatar()">
        <div class="img-cat hero img-lg gentle"><img src="shared/agnes-cat.webp" alt="猫娘"></div>
        <div class="avatar-edit-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
        </div>
      </div>
      <div class="avatar-hint">点击更换头像</div>
    </div>

    <!-- 表单 -->
    <div class="form-section">
      <div class="field-group">
        <label class="field-label">用户 ID</label>
        <input class="input-field" value="NianNian2024" disabled style="opacity:0.55;cursor:not-allowed;">
      </div>

      <div class="field-group">
        <label class="field-label">昵称</label>
        <input class="input-field" id="nickname" value="小明" placeholder="请输入昵称" maxlength="20">
      </div>

      <div class="field-group">
        <label class="field-label">个性签名</label>
        <textarea class="input-field" id="bio" placeholder="写一句话介绍自己..." maxlength="60">和猫娘一起聊天的每一天~</textarea>
      </div>

      <div class="field-group">
        <label class="field-label">性别</label>
        <div class="gender-row">
          <button class="radio-option selected" data-value="male" onclick="selectGender(this,'男')">男</button>
          <button class="radio-option" data-value="female" onclick="selectGender(this,'女')">女</button>
          <button class="radio-option" data-value="custom" onclick="selectGender(this,'自定义')">自定义</button>
        </div>
        <div class="custom-gender-wrap" id="customGenderWrap" style="display:none;">
          <input class="input-field" id="customGender" placeholder="输入自定义性别…" maxlength="20" style="margin-top:10px;">
          <div class="gender-templates">
            <span class="gender-tag" onclick="applyGenderTemplate('沃尔玛购物袋')">沃尔玛购物袋</span>
            <span class="gender-tag" onclick="applyGenderTemplate('武装直升机')">武装直升机</span>
          </div>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">生日</label>
        <div class="input-field" id="birthdayDisplay" onclick="showDatePicker()" style="cursor:pointer;display:flex;justify-content:space-between;align-items:center;">
          <span id="birthdayText">2000-01-01</span>
          <span style="color:#C0A0B0;font-size:12px;">▼</span>
        </div>
        <input type="hidden" id="birthday" value="2000-01-01">
      </div>
    </div>

    <button class="btn-primary" style="width:calc(100% - 40px);margin:24px 20px 8px;" onclick="saveProfile()">保存</button>
  </div>
  <div class="toast" id="toast"></div>

  <!-- C2：自定义三列滚轮日期选择器 -->
  <div class="date-picker-overlay hidden" id="datePickerOverlay" onclick="if(event.target===this)hideDatePicker()">
    <div class="date-picker-sheet">
      <div class="dp-header">
        <button class="dp-btn-cancel" onclick="hideDatePicker()">取消</button>
        <span class="dp-title">选择生日</span>
        <button class="dp-btn-confirm" onclick="confirmDatePicker()">确定</button>
      </div>
      <div class="dp-columns">
        <div class="dp-col" id="dpYear"></div>
        <div class="dp-col" id="dpMonth"></div>
        <div class="dp-col" id="dpDay"></div>
      </div>
    </div>
  </div>
</div>

<script>
// [安全] _resolveUrl 已由 app.js 全局提供（含协议白名单过滤）

var selectedGender = '男';
var currentPersona = 'gentle'; // 当前猫娘人格：gentle/tsundere/energetic/default

function selectGender(el, gender) {
  selectedGender = gender;
  var wrap = document.getElementById('customGenderWrap');
  if (gender === '自定义') {
    wrap.style.display = 'block';
  } else {
    wrap.style.display = 'none';
    document.getElementById('customGender').value = '';
  }
  el.parentElement.querySelectorAll('.radio-option').forEach(function(b){ b.classList.remove('selected'); });
  el.classList.add('selected');
}

function applyGenderTemplate(value) {
  document.getElementById('customGender').value = value;
}

function changeAvatar() {
  // 触发文件选择器上传真实头像（调 API.uploadAvatar）
  var fileInput = document.getElementById('avatarFileInput');
  if (!fileInput) {
    fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.id = 'avatarFileInput';
    fileInput.accept = 'image/jpeg,image/png,image/webp,image/gif';
    fileInput.style.display = 'none';
    document.body.appendChild(fileInput);
    fileInput.addEventListener('change', handleAvatarSelected);
  }
  fileInput.click();
}

function handleAvatarSelected(e) {
  var file = e.target.files && e.target.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) { showToast('头像最大 2MB'); return; }
  showToast('上传中…');
  if (typeof API === 'undefined' || !API.uploadAvatar) { showToast('上传功能不可用'); return; }
  API.uploadAvatar(file).then(function(r) {
    // 用返回的 avatar_url 替换头像显示（补全服务器URL前缀）
    var wrap = document.getElementById('avatarDisplay');
    if (wrap && r.avatar_url) {
      var fullUrl = _resolveUrl(r.avatar_url);
      // [安全] 用 createElement 安全设置图片 src
      wrap.innerHTML = '';
      var img = _safeCreateImg(fullUrl, '头像');
      img.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:50%;';
      wrap.appendChild(img);
      var badge = document.createElement('div');
      badge.className = 'avatar-edit-badge';
      badge.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>';
      wrap.appendChild(badge);
    }
    showToast('头像已更新');
    // 同步到 current_user
    try {
      var u = API.getCurrentUser();
      if (u) { u.avatar_url = r.avatar_url; API.setCurrentUser(u); }
    } catch (e2) {}
  }).catch(function(err) {
    showToast('上传失败：' + (err.message || '未知错误'));
  });
}

function saveProfile() {
  var nickEl = document.getElementById('nickname');
  var nickname = nickEl ? nickEl.value.trim() : '';
  if (!nickname) { showToast('昵称不能为空'); return; }
  // 构建 API 数据：gender 只发 male/female/custom，自定义文本走 custom_gender 字段
  var data = { nickname: nickname };
  if (selectedGender === '自定义') {
    data.gender = 'custom';
    var customVal = document.getElementById('customGender').value.trim();
    if (customVal) data.custom_gender = customVal;
  } else {
    var GENDER_MAP = { '男': 'male', '女': 'female' };
    data.gender = GENDER_MAP[selectedGender] || 'male';
  }
  var bioEl = document.getElementById('bio');
  if (bioEl && bioEl.value.trim()) data.bio = bioEl.value.trim();
  var bdEl = document.getElementById('birthday');
  if (bdEl && bdEl.value) data.birthday = bdEl.value;
  // 诊断：显示当前状态
  var token = localStorage.getItem('access_token');
  var hasToken = !!(token && token.length > 10);
  var server = (window.APP_CONFIG && window.APP_CONFIG.server_base) || 'unknown';
  // [安全] 不再记录 token 片段到控制台
  
  if (typeof API === 'undefined') {
    showToast('API 未加载，请重启 App');
    return;
  }
  if (!API.isLoggedIn || !API.isLoggedIn()) {
    showToast('未登录：token=' + (hasToken ? '有(' + token.substring(0,10) + '...)' : '无'));
    return;
  }
  
  showToast('保存中…');
  API.updateProfile(data).then(function(updated) {
    // 同步更新 localStorage 中的 current_user
    try {
      var u = API.getCurrentUser() || {};
      if (updated) {
        // 后端返回完整 user 对象时使用
        API.setCurrentUser(Object.assign(u, updated));
      } else {
        // 降级：手动合并本地字段
        Object.assign(u, data);
        API.setCurrentUser(u);
      }
    } catch (e2) {}
    showToast('个人资料已保存 ✓');
    setTimeout(function(){ location.href = '我的.html'; }, 1200);
  }).catch(function(err) {
    showToast('保存失败：' + (err.message || '未知错误'));
    console.error('[profile] error:', err);
  });
}

// ===== C2：自定义三列日期选择器（tap-to-select）=====
var pickerYear = 2000, pickerMonth = 1, pickerDay = 1;

function showDatePicker() {
  var current = document.getElementById('birthday').value;
  if (current) {
    var parts = current.split('-');
    pickerYear = parseInt(parts[0]) || 2000;
    pickerMonth = parseInt(parts[1]) || 1;
    pickerDay = parseInt(parts[2]) || 1;
  }
  fillYearCol();
  fillMonthCol();
  fillDayCol();
  document.getElementById('datePickerOverlay').classList.remove('hidden');
}

function fillYearCol() {
  var col = document.getElementById('dpYear');
  col.innerHTML = '';
  for (var y = 2020; y >= 1940; y--) {
    var item = document.createElement('div');
    item.className = 'dp-item' + (y === pickerYear ? ' selected' : '');
    item.textContent = y;
    item.onclick = (function(val) { return function() {
      pickerYear = val;
      col.querySelectorAll('.dp-item').forEach(function(i) { i.classList.remove('selected'); });
      this.classList.add('selected');
      fillDayCol(); // 年份变化可能影响闰年2月天数
    }; })(y);
    col.appendChild(item);
  }
  // 手动滚动到选中项（不用 scrollIntoView，在弹窗 fixed 定位内可能失效）
  var sel = col.querySelector('.dp-item.selected');
  if (sel) {
    var colH = col.clientHeight;
    var itemTop = sel.offsetTop;
    col.scrollTop = itemTop - colH / 2 + sel.offsetHeight / 2;
  }
}

function fillMonthCol() {
  var col = document.getElementById('dpMonth');
  col.innerHTML = '';
  for (var m = 1; m <= 12; m++) {
    var item = document.createElement('div');
    item.className = 'dp-item' + (m === pickerMonth ? ' selected' : '');
    item.textContent = m + '月';
    item.onclick = (function(val) { return function() {
      pickerMonth = val;
      col.querySelectorAll('.dp-item').forEach(function(i) { i.classList.remove('selected'); });
      this.classList.add('selected');
      fillDayCol(); // 月份变化 → 刷新天数
    }; })(m);
    col.appendChild(item);
  }
  var sel = col.querySelector('.dp-item.selected');
  // rAF 双帧延迟确保列已渲染且有高度
  requestAnimationFrame(function() {
    requestAnimationFrame(function() {
      var sel2 = col.querySelector('.dp-item.selected');
      if (sel2 && col.clientHeight > 0) {
        col.scrollTop = sel2.offsetTop - col.clientHeight / 2 + sel2.offsetHeight / 2;
      }
    });
  });
}

function fillDayCol() {
  // 获取该月天数：new Date(y, m, 0) — m 是 JS 0-index 月份，所以用 pickerMonth 传进去正好
  // 例：pickerMonth=2(2月) → new Date(2000,2,0) = 2月最后一天 → 29 (闰年)
  var daysInMonth = new Date(pickerYear, pickerMonth, 0).getDate();
  if (pickerDay > daysInMonth) pickerDay = daysInMonth;
  var col = document.getElementById('dpDay');
  col.innerHTML = '';
  for (var d = 1; d <= daysInMonth; d++) {
    var item = document.createElement('div');
    item.className = 'dp-item' + (d === pickerDay ? ' selected' : '');
    item.textContent = d + '日';
    item.onclick = (function(val) { return function() {
      pickerDay = val;
      col.querySelectorAll('.dp-item').forEach(function(i) { i.classList.remove('selected'); });
      this.classList.add('selected');
    }; })(d);
    col.appendChild(item);
  }
  var sel = col.querySelector('.dp-item.selected');
  // rAF 双帧延迟确保列已渲染且有高度
  requestAnimationFrame(function() {
    requestAnimationFrame(function() {
      var sel2 = col.querySelector('.dp-item.selected');
      if (sel2 && col.clientHeight > 0) {
        col.scrollTop = sel2.offsetTop - col.clientHeight / 2 + sel2.offsetHeight / 2;
      }
    });
  });
}

function confirmDatePicker() {
  var dateStr = pickerYear + '-' + String(pickerMonth).padStart(2,'0') + '-' + String(pickerDay).padStart(2,'0');
  document.getElementById('birthday').value = dateStr;
  document.getElementById('birthdayText').textContent = dateStr;
  hideDatePicker();
}

function hideDatePicker() {
  document.getElementById('datePickerOverlay').classList.add('hidden');
}
</script>

<script src="shared/dist/native.js"></script>
<script src="shared/dist/config.js"></script>
<script src="shared/dist/api.js"></script>
<script src="shared/dist/app.js"></script>
<script>
// Load user profile — C1：修回填选择器匹配实际元素 id/class
if (API.isLoggedIn()) {
  API.getProfile().then(function(user) {
    console.log('[profile] loaded:', JSON.stringify(user).substring(0, 300));
    var nickEl = document.getElementById('nickname');
    var bioEl = document.getElementById('bio');
    if (nickEl) nickEl.value = user.nickname || '';
    if (bioEl) bioEl.value = user.bio || '';
    // birthday — 支持多种字段名
    var bdEl = document.getElementById('birthday');
    var bdText = document.getElementById('birthdayText');
    var birthday = user.birthday || user.birth_date || '';
    if (bdEl && birthday) bdEl.value = birthday;
    if (bdText && birthday) bdText.textContent = birthday;
    // avatar — 从 API 回填头像（补全服务器URL前缀）
    if (user.avatar_url) {
      var wrap = document.getElementById('avatarDisplay');
      if (wrap) {
        var fullUrl = _resolveUrl(user.avatar_url);
        wrap.innerHTML = '<img src="' + fullUrl + '" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">' +
          '<div class="avatar-edit-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/></svg></div>';
      }
    }
    // gender — 用 data-value 匹配API返回的 male/female/custom
    if (user.gender) {
      // 反向映射：英文→中文
      var GENDER_REVERSE = { 'male': '男', 'female': '女', 'custom': '自定义' };
      var cnGender = GENDER_REVERSE[user.gender] || user.gender;
      selectedGender = cnGender; // 同步更新全局变量，保存时用
      var opts = document.querySelectorAll('.radio-option');
      opts.forEach(function(c) {
        var val = c.getAttribute('data-value') || c.textContent.trim();
        if (val === user.gender) {
          c.classList.add('selected');
        } else {
          c.classList.remove('selected');
        }
      });
      // 如果是 custom，显示自定义输入框
      var wrap = document.getElementById('customGenderWrap');
      if (user.gender === 'custom') {
        if (wrap) wrap.style.display = 'block';
        // 如果后端返回了自定义性别文本，填充到输入框
        var customText = user.custom_gender || user.custom_gender_text || '';
        if (customText) {
          var customInput = document.getElementById('customGender');
          if (customInput) customInput.value = customText;
        }
      } else {
        if (wrap) wrap.style.display = 'none';
      }
    }
  }).catch(function(err) {
    console.warn('[profile] load failed:', err.message || err);
  });
}
</script>
</body>
</html>
