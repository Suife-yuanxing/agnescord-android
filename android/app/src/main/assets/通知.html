<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>通知 — UI 原型</title>
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/base.css">
<link rel="stylesheet" href="shared/components.css">
<link rel="stylesheet" href="shared/effects.css">
<style>
/* ===== 通知 — 页面专属样式 ===== */
.title-bar .clear-all {
  font-size: 13px; font-weight: 600; color: #fff; cursor: pointer;
  background: rgba(255,255,255,0.15); border: none; padding: 6px 14px;
  border-radius: 16px; font-family: inherit; transition: all 0.2s;
}
.title-bar .clear-all:hover { background: rgba(255,255,255,0.25); }

/* 通知分组 */
.notif-group { margin: 0 16px 8px; }
.group-label {
  font-size: 12px; font-weight: 700; color: #B090A0;
  margin: 12px 4px 8px; letter-spacing: 0.5px;
}

/* 通知条目 */
.notif-item {
  display: flex; gap: 12px; padding: 14px 16px; cursor: pointer;
  background: rgba(255,255,255,0.7); backdrop-filter: blur(8px);
  border-radius: 16px; margin-bottom: 8px; transition: all 0.2s; position: relative;
}
.notif-item:last-of-type { margin-bottom: 0; }
.notif-item:active { background: rgba(244, 114, 182,0.04); }
.notif-item.unread { background: rgba(255,255,255,0.9); }

.notif-icon {
  width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.notif-icon.sys { background: linear-gradient(135deg, #F472B6, #F9A8D4); }
.notif-icon.msg { background: linear-gradient(135deg, #C4B5FD, #B794F4); }
.notif-icon.bot { background: linear-gradient(135deg, #FFB347, #FFC773); }
.notif-icon.update { background: linear-gradient(135deg, #4CAF50, #81C784); }
.notif-icon svg { width: 18px; height: 18px; stroke: #fff; }

.notif-content { flex: 1; min-width: 0; }
.notif-title { font-size: 14px; font-weight: 700; color: #3A2030; margin-bottom: 2px; }
.notif-body { font-size: 12px; color: #B090A0; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.notif-time { font-size: 11px; color: #C0A0B0; margin-top: 4px; }

.notif-dot {
  width: 8px; height: 8px; border-radius: 50%; background: #F472B6;
  flex-shrink: 0; align-self: center;
  box-shadow: 0 0 0 2px #FFF5F7;
}

/* 空态 */
.empty-state { text-align: center; padding: 80px 20px; }
.empty-state .icon { margin: 0 auto 16px; width: 72px; height: 72px; }
.empty-state .icon svg { width: 72px; height: 72px; stroke: #D0B0C0; }
.empty-state .title { font-size: 17px; font-weight: 700; color: #3A2030; margin-bottom: 6px; }
.empty-state .desc { font-size: 13px; color: #B090A0; }
</style>
</head>
<body>
<div class="phone" data-emotion="3">
  <div class="title-bar">
    <a class="back" href="首页仪表盘.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <span class="title">通知</span>
    <button class="clear-all" onclick="clearAll()">全部已读</button>
  </div>
  <div class="scroll-area" id="notifList">
    <div class="empty-state"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="animation:spin 1s linear infinite;"><circle cx="12" cy="12" r="10" stroke-dasharray="40" stroke-dashoffset="20"/></svg></div><div class="title">加载中…</div></div>
  </div>
  <div class="toast" id="toast"></div>
</div>
<script src="shared/native.js"></script>
<script src="shared/config.js"></script>
<script src="shared/api.js"></script>
<script src="shared/app.js"></script>
<script>
// ===== 通知 — API 数据加载 =====
(function() {
  'use strict';
  // 未登录时显示空态（不强制跳转）

  var TYPE_ICONS = { system: 'sys', msg: 'msg', bot: 'bot', update: 'update' };
  var TYPE_SVG = {
    system: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
    msg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4h16v13H8l-4 4v-4H4z"/></svg>',
    bot: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="5"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>',
    update: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>'
  };

  function groupByDate(items) {
    var today = new Date(); today.setHours(0,0,0,0);
    var yesterday = new Date(today - 864e5);
    var groups = { today: [], yesterday: [], earlier: [] };
    items.forEach(function(n) {
      var d = new Date(n.created_at * 1000);
      d.setHours(0,0,0,0);
      if (d.getTime() >= today.getTime()) groups.today.push(n);
      else if (d.getTime() >= yesterday.getTime()) groups.yesterday.push(n);
      else groups.earlier.push(n);
    });
    return groups;
  }

  function formatTime(ts) {
    var d = new Date(ts * 1000);
    var now = new Date();
    if (d.toDateString() === now.toDateString()) {
      return ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
    }
    return (d.getMonth()+1) + '月' + d.getDate() + '日';
  }

  function renderNotifications(data) {
    var container = document.getElementById('notifList');
    if (!data || !data.notifications || data.notifications.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg></div><div class="title">暂无通知</div><div class="desc">一切正常，有消息会出现在这里</div></div>';
      return;
    }
    var groups = groupByDate(data.notifications);
    var labels = { today: '今天', yesterday: '昨天', earlier: '更早' };
    var html = '';
    ['today', 'yesterday', 'earlier'].forEach(function(key) {
      var items = groups[key];
      if (!items.length) return;
      html += '<div class="notif-group"><div class="group-label">' + labels[key] + '</div>';
      items.forEach(function(n) {
        var iconCls = TYPE_ICONS[n.type] || 'sys';
        var svg = TYPE_SVG[n.type] || TYPE_SVG.system;
        html += '<div class="notif-item' + (n.is_read ? '' : ' unread') + '" data-id="' + n.id + '" onclick="markRead(' + n.id + ', this)">' +
          '<div class="notif-icon ' + iconCls + '">' + svg + '</div>' +
          '<div class="notif-content"><div class="notif-title">' + _esc(n.title) + '</div><div class="notif-body">' + _esc(n.body) + '</div><div class="notif-time">' + formatTime(n.created_at) + '</div></div>' +
          (n.is_read ? '' : '<div class="notif-dot"></div>') +
        '</div>';
      });
      html += '</div>';
    });
    container.innerHTML = html + '<div style="height:20px;"></div>';
  }

  // [安全] 统一使用全局 escapeHtml
  function _esc(s) { return escapeHtml(s); }

  window.markRead = function(id, el) {
    if (el.classList.contains('unread')) {
      el.classList.remove('unread');
      var dot = el.querySelector('.notif-dot');
      if (dot) dot.remove();
      API.markNotificationRead(id).catch(function(){});
    }
  };

  window.clearAll = function() {
    API.markAllNotificationsRead().then(function() {
      document.querySelectorAll('.notif-item.unread').forEach(function(el) {
        el.classList.remove('unread');
        var dot = el.querySelector('.notif-dot');
        if (dot) dot.remove();
      });
      if (window.showToast) showToast('全部已读');
    }).catch(function(err) {
      if (window.showToast) showToast('操作失败: ' + (err.message || ''));
    });
  };

  // 加载
  API.getNotifications({limit: 50}).then(renderNotifications).catch(function(err) {
    document.getElementById('notifList').innerHTML = '<div class="empty-state"><div class="title">加载失败</div><div class="desc">' + _esc(err.message||'网络错误') + '</div></div>';
  });
})();
</script>
</body>
</html>
