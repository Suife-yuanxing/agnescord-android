<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>聊天页 v2 — UI 原型</title>
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/base.css">
<link rel="stylesheet" href="shared/components.css">
<link rel="stylesheet" href="shared/anime-cat.css">
<link rel="stylesheet" href="shared/effects.css">
<script src="shared/native.js"></script>
<link rel="stylesheet" href="shared/pages/chat.css">
</head>
<body>
<div class="phone" id="phoneFrame" data-emotion="5">
  <!-- 自定义聊天壁纸层 -->
  <div class="chat-bg" id="chatBg"></div>

  <!-- 壁纸选择器 -->
  <div class="bg-picker" id="bgPicker">
    <div class="bg-opt" style="background:linear-gradient(135deg,#FFE0E8,#FFD4DC);" onclick="setChatBg('', this)" title="默认"></div>
    <div class="bg-opt" style="background:linear-gradient(135deg,#E8E0F8,#D4CCF0);" onclick="setChatBg('linear-gradient(135deg,#E8E0F8,#D4CCF0)', this)" title="紫藤"></div>
    <div class="bg-opt" style="background:#1A1A2E;" onclick="setChatBg('#1A1A2E', this)" title="暗色"></div>
    <div class="bg-opt photo-bg" onclick="setChatBg('📷', this)" title="相册选择">📷</div>
  </div>
  <input type="file" id="chatBgFileInput" accept="image/jpeg,image/png,image/webp,image/gif,image/bmp" style="opacity:0;position:absolute;width:1px;height:1px;pointer-events:none;" onchange="handleChatBgFileImport(event)">
  <!-- 上传文件 — 用 opacity:0 而非 display:none，WebView 才能触发 onShowFileChooser -->
  <input type="file" id="uploadImageInput" accept="image/*" style="opacity:0;position:absolute;width:1px;height:1px;pointer-events:none;" onchange="handleFileSelected(event, 'image')">
  <input type="file" id="uploadCameraInput" accept="image/*" capture="environment" style="opacity:0;position:absolute;width:1px;height:1px;pointer-events:none;" onchange="handleFileSelected(event, 'image')">
  <input type="file" id="uploadFileInput" style="opacity:0;position:absolute;width:1px;height:1px;pointer-events:none;" onchange="handleFileSelected(event, 'file')">
  <!-- Bot 头像上传 -->
  <input type="file" id="botAvatarInput" accept="image/*" style="opacity:0;position:absolute;width:1px;height:1px;pointer-events:none;" onchange="handleBotAvatarSelected(event)">

  <!-- 标题栏 -->
  <div class="title-bar">
    <div class="avatar-wrap" onclick="event.stopPropagation();changeBotAvatar()">
      <div class="img-cat avatar img-md"><img src="shared/agnes-cat.png" alt="猫娘"></div>
      <div class="avatar-edit-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </div>
    </div>
    <div class="info">
      <div class="name">小咪</div>
      <div class="status"><span class="dot"></span> 在线</div>
    </div>
    <span class="menu" onclick="toggleBgPicker()" title="更换壁纸">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
    </span>
    <a class="menu" id="botSettingsLink" href="Bot设置.html" title="聊天设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
    </a>
  </div>

  <!-- 消息列表 — 静态演示已删除，全部由 JS 从后端加载 -->
  <div class="message-list" id="messageList">
    <div style="text-align:center;padding:60px 20px;color:#C0A0B0;font-size:13px;">加载中…</div>
  </div>

  <!-- 输入栏 — ChatGPT 风格胶囊 🎤↔✈️ -->
  <div class="input-bar empty" id="inputBar">
    <button class="attach-btn" title="添加附件" onclick="showUploadSheet()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
    </button>
    <textarea id="inputBox" rows="1" placeholder="说点什么..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
    <div class="input-actions">
      <button class="send-btn action-btn" onclick="sendMessage()" title="发送">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
      <button class="mic-btn action-btn" id="micBtn" title="语音（暂不可用）" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </button>
    </div>
  </div>

  <!-- 底部导航 -->
  <div class="bottom-nav" id="bottomNav">
    <a class="nav-item" href="首页仪表盘.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M5 10v10a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V10"/></svg>
      首页
    </a>
    <a class="nav-item active" href="聊天页.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v13H8l-4 4v-4H4z"/></svg>
      聊天
    </a>
    <a class="nav-item" href="我的Bot.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/><circle cx="10" cy="7" r="1" fill="currentColor" stroke="none"/><circle cx="14" cy="7" r="1" fill="currentColor" stroke="none"/></svg>
      Bot管理
    </a>
    <a class="nav-item" href="我的.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M7 18c0-2 2.2-4 5-4s5 2 5 4"/></svg>
      我的
    </a>
  </div>

  <!-- 上传选择面板 -->
  <div class="modal-overlay hidden" id="uploadSheet">
    <div class="modal-sheet upload-sheet">
      <div class="modal-title">发送文件</div>
      <button class="upload-option" onclick="handleUploadImage()">
        <div class="uo-icon uo-image">🖼</div>
        相册图片
      </button>
      <button class="upload-option" onclick="handleUploadCamera()">
        <div class="uo-icon uo-camera">📷</div>
        拍照
      </button>
      <button class="upload-option" onclick="handleUploadFile()">
        <div class="uo-icon uo-file">📁</div>
        文件
      </button>
      <button class="modal-cancel" onclick="closeUploadSheet()">取消</button>
    </div>
  </div>
</div>

<script>
// ===== Staggered Entrance on Load =====
(function(){
  var rows = document.querySelectorAll('#messageList > .msg-row');
  rows.forEach(function(row, i) {
    row.classList.add('stagger-in');
    row.style.animationDelay = (i * 0.06) + 's';
  });
})();

function toggleBgPicker() {
  document.getElementById('bgPicker').classList.toggle('show');
}

// 点 picker 外部区域时关闭 picker（让用户能连续选颜色，点别处才收起）
document.addEventListener('click', function(e) {
  var picker = document.getElementById('bgPicker');
  if (!picker || !picker.classList.contains('show')) return;
  // 如果点击的不是 picker 内部、也不是触发按钮，则关闭
  if (!picker.contains(e.target) && !e.target.closest('[onclick*="toggleBgPicker"]')) {
    picker.classList.remove('show');
  }
});

var CHAT_BG_KEY = 'chatBg';

function applyChatBgToOverlay(bgData) {
  var bgEl = document.getElementById('chatBg');
  var phone = document.getElementById('phoneFrame');
  // 清除 overlay
  if (bgEl) {
    bgEl.style.backgroundImage = '';
    bgEl.style.backgroundColor = '';
    bgEl.style.opacity = '';
    bgEl.style.backgroundSize = '';
    bgEl.style.backgroundPosition = '';
  }
  // 清除 phone 背景
  if (phone) {
    phone.style.background = '';
    if (!phone.classList.contains('dark-mode')) phone.style.background = '#FFF5F7';
  }
  if (!bgData || bgData.type === 'default' || !bgData.value) {
    // 默认背景已在上方设置
    return;
  }
  if (bgData.type === 'custom') {
    if (bgEl) {
      bgEl.style.backgroundImage = 'url(' + bgData.value + ')';
      bgEl.style.backgroundSize = 'cover';
      bgEl.style.backgroundPosition = 'center';
      bgEl.style.opacity = '0.18';
    }
    if (phone) phone.style.setProperty('background', 'url(' + bgData.value + ') center/cover no-repeat', 'important');
    console.log('[chatBg] applied custom bg');
  } else if (bgData.type === 'dark') {
    if (bgEl) {
      bgEl.style.backgroundColor = bgData.value;
      bgEl.style.opacity = '0.08';
    }
    if (phone) phone.style.setProperty('background', bgData.value, 'important');
    console.log('[chatBg] applied dark bg:', bgData.value);
  } else {
    if (bgEl) {
      bgEl.style.backgroundImage = bgData.value;
      bgEl.style.opacity = '0.12';
    }
    if (phone) phone.style.setProperty('background', bgData.value, 'important');
    console.log('[chatBg] applied gradient bg');
  }
}

function setChatBg(bg, el) {
  var bgData = { type: 'default', value: '' };
  if (bg === '📷') {
    document.getElementById('chatBgFileInput').click();
    document.querySelectorAll('.bg-opt').forEach(function(o) { o.style.borderColor = 'transparent'; });
    document.getElementById('bgPicker').classList.remove('show');
    return;
  } else if (bg) {
    bgData = { type: bg.startsWith('#') ? 'dark' : 'gradient', value: bg };
  }
  localStorage.setItem(CHAT_BG_KEY, JSON.stringify(bgData));
  console.log('[chatBg] set: type=' + bgData.type + ' val=' + (bgData.value || 'default').substring(0,30));
  applyChatBgToOverlay(bgData);
  document.querySelectorAll('.bg-opt').forEach(function(o) { o.style.borderColor = 'transparent'; });
  if (el) el.style.borderColor = '#F472B6';
  // 不再自动关闭 picker — 让用户连续切换多个颜色对比，
  // 点 picker 外部区域时由 toggleBgPicker 关闭（修复"选黑色后无法切其他颜色"）
}

function handleChatBgFileImport(e) {
  var file = e.target.files[0];
  if (!file) return;
  if (!file.type.match(/image\/(jpeg|png|webp|gif|bmp)/)) {
    showToast('仅支持 JPG/PNG/WebP/GIF 图片格式', 'error');
    return;
  }
  var reader = new FileReader();
  reader.onload = function(ev) {
    var dataUrl = ev.target.result;
    if (dataUrl.length > 500 * 1024) {
      var img = new Image();
      img.onload = function() {
        var canvas = document.createElement('canvas');
        var scale = Math.min(720 / img.width, 1600 / img.height, 1);
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        dataUrl = canvas.toDataURL('image/jpeg', 0.75);
        saveChatBgCustom(dataUrl);
      };
      img.src = dataUrl;
    } else {
      saveChatBgCustom(dataUrl);
    }
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

function saveChatBgCustom(dataUrl) {
  var bgData = { type: 'custom', value: dataUrl };
  localStorage.setItem(CHAT_BG_KEY, JSON.stringify(bgData));
  applyChatBgToOverlay(bgData);
  document.querySelectorAll('.bg-opt').forEach(function(o) { o.style.borderColor = 'transparent'; });
  showToast('聊天背景已全局同步', 'success');
}

function loadChatBg() {
  try {
    var raw = localStorage.getItem(CHAT_BG_KEY);
    console.log('[chatBg] loadChatBg: raw=' + (raw ? raw.substring(0,40) : 'null'));
    if (!raw) { console.log('[chatBg] no saved bg'); return; }
    var bgData = JSON.parse(raw);
    applyChatBgToOverlay(bgData);
    var matchVal = bgData.value;
    document.querySelectorAll('.bg-opt').forEach(function(o) {
      o.style.borderColor = 'transparent';
      if (bgData.type === 'default' && o.getAttribute('onclick') && o.getAttribute('onclick').indexOf("''") > -1) {
        o.style.borderColor = '#F472B6';
      } else if (o.style.background === matchVal || (bgData.type === 'dark' && o.style.background === matchVal)) {
        o.style.borderColor = '#F472B6';
      }
    });
  } catch(e) {}
}

// ===== 🎤↔✈️ 输入监听：空输入显示麦克风，有文字变形为纸飞机 =====
(function(){
  var inputBox = document.getElementById('inputBox');
  var inputBar = document.getElementById('inputBar');
  if (inputBox && inputBar) {
    inputBox.addEventListener('input', function() {
      // 空/有内容切换麦克风↔发送按钮
      if (this.value.trim().length > 0) {
        inputBar.classList.remove('empty');
      } else {
        inputBar.classList.add('empty');
      }
      // 随内容自动变高
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 110) + 'px';
    });
  }
})();

var recordingTimer = null;
function startRecording() {
  var micBtn = document.getElementById('micBtn');
  if (micBtn) micBtn.classList.add('recording');
  recordingTimer = setTimeout(function() {
    var micBtn2 = document.getElementById('micBtn');
    if (micBtn2) micBtn2.classList.remove('recording');
    var box = document.getElementById('inputBox');
    if (box) { box.value = '🎤 语音消息（模拟）'; box.dispatchEvent(new Event('input')); }
    if (typeof showToast === 'function') showToast('语音录制完成', 'success');
  }, 1500);
}
function stopRecording() {
  clearTimeout(recordingTimer);
  var micBtn = document.getElementById('micBtn');
  if (micBtn) micBtn.classList.remove('recording');
}

// ===== 上传功能 =====
function showUploadSheet() {
  document.getElementById('uploadSheet').classList.remove('hidden');
}
function closeUploadSheet() {
  document.getElementById('uploadSheet').classList.add('hidden');
}
function handleUploadImage() {
  closeUploadSheet();
  document.getElementById('uploadImageInput').click();
}
function handleUploadCamera() {
  closeUploadSheet();
  document.getElementById('uploadCameraInput').click();
}
function handleUploadFile() {
  closeUploadSheet();
  document.getElementById('uploadFileInput').click();
}

function handleFileSelected(e, type) {
  var file = e.target.files[0];
  if (!file) return;

  var list = document.getElementById('messageList');
  var now = new Date();
  var time = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

  if (type === 'image') {
    if (!file.type.match(/image\//)) {
      if (typeof showToast === 'function') showToast('请选择图片文件', 'error');
      e.target.value = '';
      return;
    }
    // A2：先本地预览（dataURL），同时上传到后端，上传成功后替换为持久 URL
    var reader = new FileReader();
    reader.onload = function(ev) {
      var dataUrl = ev.target.result;
      // 大图压缩到 400px + JPEG
      var processAndShow = function(src) {
        if (src.length > 500 * 1024) {
          var img = new Image();
          img.onload = function() {
            var canvas = document.createElement('canvas');
            var maxW = 400, maxH = 400;
            var scale = Math.min(maxW / img.width, maxH / img.height, 1);
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            var ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            appendImageMessage(list, canvas.toDataURL('image/jpeg', 0.72), file.name, time);
          };
          img.src = src;
        } else {
          appendImageMessage(list, src, file.name, time);
        }
      };
      processAndShow(dataUrl); // 即时本地预览

      // 上传到后端，成功后替换预览为持久URL
      if (typeof API !== 'undefined' && API.uploadChatImage && window._chat && window._chat.botId) {
        var imgRow = list.lastElementChild;
        API.uploadChatImage(window._chat.botId, file).then(function(r) {
          // 替换本地预览为服务器URL，切换页面后不会消失
          if (imgRow && r.url) {
            var imgEl = imgRow.querySelector('.msg-img');
            if (imgEl) { imgEl.src = _resolveUrl(r.url); imgEl.setAttribute('data-persist', '1'); }
          }
          if (typeof showToast === 'function') showToast('图片已上传');
        }).catch(function(err) {
          if (typeof showToast === 'function') showToast('图片上传失败: ' + (err.message || ''));
        });
      }
    };
    reader.readAsDataURL(file);
  } else {
    // 文件消息
    appendFileMessage(list, file.name, file.size, time);
  }

  e.target.value = '';
}

function appendImageMessage(list, dataUrl, fileName, time) {
  var row = document.createElement('div');
  row.className = 'msg-row me';
  row.innerHTML =
    '<div class="msg-avatar user">我</div>' +
    '<div class="bubble me" style="padding:5px;background:transparent;box-shadow:none;">' +
    '<img class="msg-img" src="' + dataUrl + '" alt="' + fileName.replace(/"/g, '&quot;') + '" onclick="previewImage(this.src)" loading="lazy">' +
    '<div style="display:flex;justify-content:flex-end;align-items:center;gap:4px;padding:2px 4px 0;">' +
    '<span class="time" style="color:rgba(255,255,255,0.6);">' + time + '</span>' +
    '<span style="font-size:10px;opacity:0.4;">✓</span>' +
    '</div></div>';
  list.appendChild(row);
  list.scrollTo({ top: list.scrollHeight, behavior: 'smooth' });
}

function appendFileMessage(list, fileName, fileSize, time) {
  var ext = fileName.split('.').pop().toLowerCase();
  var icon = '📄';
  if (/pdf/i.test(ext)) icon = '📕';
  else if (/doc|docx/i.test(ext)) icon = '📝';
  else if (/xls|xlsx|csv/i.test(ext)) icon = '📊';
  else if (/ppt|pptx/i.test(ext)) icon = '📽';
  else if (/zip|rar|7z|tar|gz/i.test(ext)) icon = '📦';
  else if (/mp3|wav|ogg|flac/i.test(ext)) icon = '🎵';
  else if (/mp4|mov|avi|mkv/i.test(ext)) icon = '🎬';
  else if (/txt|md|log/i.test(ext)) icon = '📃';

  var row = document.createElement('div');
  row.className = 'msg-row me';
  row.innerHTML =
    '<div class="msg-avatar user">我</div>' +
    '<div class="bubble me" style="padding:6px;">' +
    '<div class="msg-file">' +
    '<div class="file-icon">' + icon + '</div>' +
    '<div class="file-info">' +
    '<div class="file-name">' + fileName.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;') + '</div>' +
    '<div class="file-size">' + formatFileSize(fileSize) + '</div>' +
    '</div></div>' +
    '<div class="time" style="margin-top:4px;">' + time + '</div>' +
    '</div>';
  list.appendChild(row);
  list.scrollTo({ top: list.scrollHeight, behavior: 'smooth' });
}

function formatFileSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

function previewImage(src) {
  var lb = document.createElement('div');
  lb.className = 'img-lightbox';
  lb.setAttribute('aria-label', '图片预览');
  lb.setAttribute('role', 'dialog');
  lb.innerHTML = '<img src="' + src + '" alt="预览图片">';
  lb.onclick = function() { lb.remove(); };
  // ESC 关闭
  lb.setAttribute('tabindex', '0');
  lb.onkeydown = function(e) { if (e.key === 'Escape') { lb.remove(); } };
  document.getElementById('phoneFrame').appendChild(lb);
  lb.focus();
}

// Upload sheet: click mask to close
document.addEventListener('click', function(e) {
  if (e.target.id === 'uploadSheet') {
    document.getElementById('uploadSheet').classList.add('hidden');
  }
});

function sendMessage() {
  var box = document.getElementById('inputBox');
  var text = box.value.trim();
  if (!text) return;
  box.value = '';
  box.style.height = 'auto';
  // 触发 input 事件切回麦克风
  box.dispatchEvent(new Event('input'));

  var sendBtn = document.querySelector('.send-btn');
  sendBtn.classList.add('sending');
  setTimeout(function(){ sendBtn.classList.remove('sending'); }, 600);

  var list = document.getElementById('messageList');
  var now = new Date();
  var time = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');

  // 用户消息（本地立即显示，ack 到达后回填 msg-id）
  var userMsg = document.createElement('div');
  userMsg.className = 'msg-row me';
  userMsg.innerHTML = '<div class="msg-avatar user">我</div><div class="bubble me anim-in" data-pending="1">'+escapeHtml(text)+'<div class="time">'+time+' <span style="font-size:9px;opacity:0.5;">✓</span></div></div>';
  list.appendChild(userMsg);

  // Bot 气泡占位（typing dots，收到首个 token 后清掉换成流式文本 + 光标）
  var botMsg = document.createElement('div');
  botMsg.className = 'msg-row';
  botMsg.style.opacity = '0';
  botMsg.innerHTML = '<div class="msg-avatar bot"><div class="img-cat avatar img-sm"><img src="shared/agnes-cat.png" alt="猫娘"></div></div><div class="bubble bot"><div class="typing-dots"><span></span><span></span><span></span></div></div>';
  list.appendChild(botMsg);
  requestAnimationFrame(function() {
    botMsg.style.transition = 'opacity 0.2s ease';
    botMsg.style.opacity = '1';
  });
  list.scrollTop = list.scrollHeight;

  // 记录到 pendingBotBubble，WS onToken/onDone 会填充它
  window._chat.pendingBotBubble = botMsg;
  botMsg._typingShown = true;

  // 通过 WS 发送（client_id 幂等去重）
  var clientId = API.newClientId();
  try {
    if (!API.wsReady()) {
      // WS 未就绪 → 提示并尝试重连
      if (typeof showToast === 'function') showToast('连接中，请稍候...');
      connectWs();
      // 1s 后若已就绪则补发
      setTimeout(function() {
        if (API.wsReady()) {
          API.sendMsg(window._chat.botId, text, clientId);
        } else {
          var b = window._chat.pendingBotBubble;
          if (b) b.querySelector('.bubble.bot').innerHTML = '<div class="stream-text">(未连接服务器，请重试)</div>';
          window._chat.pendingBotBubble = null;
        }
      }, 1000);
    } else {
      API.sendMsg(window._chat.botId, text, clientId);
    }
  } catch (e) {
    if (typeof showToast === 'function') showToast('发送失败: ' + e.message);
    if (botMsg) botMsg.querySelector('.bubble.bot').innerHTML = '<div class="stream-text">(发送失败)</div>';
    window._chat.pendingBotBubble = null;
  }
}

// typing → 流式文本切换：首个 token 到达时调用（由 onToken 间接触发）
// 在 onToken 里检查 pendingBotBubble._typingShown，若是则替换 typing dots
var _origOnToken = null;
</script>

<script>
// ===== 长按菜单（事件委托，支持动态消息）=====
(function(){
  var menu = null;
  var longPressTimer = null;

  // 事件委托：在 messageList 上监听，而非逐个 bubble 绑定
  var list = document.getElementById('messageList');
  if (!list) return;

  function getBubble(target) {
    return target.closest('.bubble.bot, .bubble.me');
  }

  list.addEventListener('touchstart', function(e) {
    var bubble = getBubble(e.target);
    if (!bubble) return;
    longPressTimer = setTimeout(function() {
      showLongPressMenu(e, bubble);
    }, 500);
  });
  list.addEventListener('touchend', function() { clearTimeout(longPressTimer); });
  list.addEventListener('touchmove', function() { clearTimeout(longPressTimer); });
  list.addEventListener('contextmenu', function(e) {
    var bubble = getBubble(e.target);
    if (!bubble) return;
    e.preventDefault();
    showLongPressMenu(e, bubble);
  });

  function showLongPressMenu(e, bubble) {
    if (menu) menu.remove();
    menu = document.createElement('div');
    menu.className = 'longpress-menu show';
    var clientX = e.clientX || (e.touches && e.touches[0] && e.touches[0].clientX) || 100;
    var clientY = e.clientY || (e.touches && e.touches[0] && e.touches[0].clientY) || 100;
    menu.style.left = Math.min(clientX, window.innerWidth - 140) + 'px';
    menu.style.top = Math.min(clientY, window.innerHeight - 120) + 'px';
    menu.style.position = 'fixed';

    var isOwn = bubble.classList.contains('me');
    var items = isOwn ? ['复制', '撤回', '删除'] : ['复制', '举报'];

    items.forEach(function(item, i) {
      var btn = document.createElement('button');
      btn.className = 'lp-item' + (item === '删除' || item === '举报' ? ' danger' : '');
      btn.textContent = item;
      btn.style.animationDelay = (i * 0.04) + 's';
      btn.onclick = function() { handleMenuAction(item, bubble); menu.remove(); menu = null; };
      menu.appendChild(btn);
    });
    document.body.appendChild(menu);
  }

  function handleMenuAction(item, bubble) {
    var msgId = bubble.getAttribute('data-msg-id');

    if (item === '复制') {
      var text = bubble.textContent || '';
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function() {
          showToast('已复制到剪贴板', 'success');
        }).catch(function() { showToast('已复制', 'success'); });
      } else {
        showToast('已复制', 'success'); // WebView 降级
      }
      return;
    }

    if (item === '撤回') {
      if (!msgId) {
        // 本地消息（WS 未返回 ack 的消息）
        bubble.innerHTML = '<span style="color:#C0A0B0;font-style:italic;">你撤回了一条消息</span>';
        bubble.style.background = 'transparent';
        bubble.removeAttribute('data-msg-id');
        bubble.setAttribute('data-recalled', '1');
        showToast('消息已撤回', 'info');
        return;
      }
      API.recallMessage(msgId).then(function() {
        bubble.innerHTML = '<span style="color:#C0A0B0;font-style:italic;">你撤回了一条消息</span>';
        bubble.style.background = 'transparent';
        bubble.setAttribute('data-recalled', '1');
        showToast('消息已撤回', 'info');
      }).catch(function(e) {
        showToast('撤回失败: ' + e.message, 'error');
      });
      return;
    }

    if (item === '删除') {
      if (!msgId) {
        bubble.closest('.msg-row').remove();
        showToast('消息已删除', 'info');
        return;
      }
      API.deleteMessage(msgId).then(function() {
        bubble.closest('.msg-row').remove();
        showToast('消息已删除', 'info');
      }).catch(function(e) {
        showToast('删除失败: ' + e.message, 'error');
      });
      return;
    }

    if (item === '举报') {
      if (!msgId) {
        showToast('暂无法举报此消息', 'error');
        return;
      }
      API.reportMessage(msgId, '用户举报').then(function() {
        showToast('已提交举报，我们会尽快处理', 'success');
      }).catch(function(e) {
        showToast('举报失败: ' + e.message, 'error');
      });
      return;
    }
  }

  document.addEventListener('click', function(e) {
    if (menu && !menu.contains(e.target)) { menu.remove(); menu = null; }
  });
})();
</script>
