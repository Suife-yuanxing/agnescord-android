<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>聊天页 v2 — UI 原型</title>
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/base.css">
<link rel="stylesheet" href="shared/components.css">
<link rel="stylesheet" href="shared/anime-cat.css">
<link rel="stylesheet" href="shared/dark-mode.css">
<link rel="stylesheet" href="shared/effects.css">
<script src="shared/native.js"></script>
<style>
/* ===== Animation System (UI/UX Pro Max v2) ===== */
/* Page enter — unique CHAT version: translateX (NOT scale+Y like standard) */
@keyframes page-push-enter {
  from { opacity: 0; transform: translateX(30px); }
  to { opacity: 1; transform: translateX(0); }
}
/* Bubble entrance — spring from bottom */
@keyframes bubble-in {
  0%   { opacity: 0; transform: translateY(16px) scale(0.92); }
  60%  { opacity: 1; transform: translateY(-2px) scale(1.02); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}
/* Bubble entrance for own messages — from right */
@keyframes bubble-in-me {
  0%   { opacity: 0; transform: translateX(20px) scale(0.92); }
  60%  { opacity: 1; transform: translateX(-2px) scale(1.02); }
  100% { opacity: 1; transform: translateX(0) scale(1); }
}
/* Long-press menu spring entrance */
@keyframes menu-spring-in {
  0%   { opacity: 0; transform: scale(0.8) translateY(8px); }
  70%  { opacity: 1; transform: scale(1.04) translateY(-1px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}
/* Toast slide-down + fade */
@keyframes toast-in {
  0%   { opacity: 0; transform: translateY(-20px); }
  100% { opacity: 1; transform: translateY(0); }
}
@keyframes toast-out {
  0%   { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-12px); }
}
/* Offline banner slide */
@keyframes banner-slide-down {
  from { transform: translateY(-100%); opacity: 0; }
  to   { transform: translateY(0); opacity: 1; }
}
/* Background picker scale in */
@keyframes picker-scale-in {
  from { opacity: 0; transform: scale(0.85); }
  to   { opacity: 1; transform: scale(1); }
}
/* Send button pulse — ChatGPT style */
@keyframes send-pulse-gpt {
  0%   { box-shadow: 0 0 0 0 rgba(244, 114, 182, 0.4); }
  50%  { box-shadow: 0 0 0 6px rgba(244, 114, 182, 0.15); }
  100% { box-shadow: 0 0 0 0 rgba(26, 26, 26, 0); }
}
/* Blink cursor */
@keyframes blink { 0%,50% { opacity:1; } 51%,100% { opacity:0; } }

/* ===== Body (chat-specific: fixed bg) ===== */
body {
  display: flex; justify-content: center; align-items: center; min-height: 100vh;
  background: linear-gradient(150deg, #FFE0E8 0%, #FFD4DC 25%, #FFE8F0 50%, #FFDDE5 75%, #FFE5EC 100%);
  background-attachment: fixed;
  font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  overflow-x: hidden;
}

/* ===== 手机框 — 仅保留与 base.css 默认不同的视觉差异 =====
   尺寸/定位/圆角/overflow/display/flex-direction 交给 base.css 默认 +
   [data-platform="native"] 全屏覆盖规则，避免页面 <style> 盖掉 native 全屏适配
   （原硬编码 360×800+relative 导致真机 1080×2376 只显示居中小框 + 两侧黑边）。 */
.phone {
  background: var(--bg-page, #F5F5F5);
  box-shadow: 0 20px 60px rgba(244,114,182,0.2), 0 0 0 3px rgba(255,255,255,0.5);
  animation: page-push-enter 0.35s cubic-bezier(0.25, 0.1, 0.25, 1) both;
  transition: background 0.4s ease;
}

/* ===== 自定义背景覆盖层 ===== */
.chat-bg {
  position: absolute; inset: 0; pointer-events: none; z-index: 0;
  background-size: cover; background-position: center;
  opacity: 0.12;
}
/* 背景选择面板 */
.bg-picker {
  position: absolute; top: 100px; right: 10px; z-index: 20;
  background: rgba(255,255,255,0.9); backdrop-filter: blur(16px);
  border-radius: 14px; padding: 10px; display: none;
  box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  flex-direction: column; gap: 6px;
}
.bg-picker.show { display: flex; }
.bg-picker .bg-opt {
  width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
  border: 2px solid transparent; transition: all 0.2s;
}
.bg-picker .bg-opt:hover { border-color: #F472B6; transform: scale(1.1); }
.bg-picker .bg-opt.photo-bg {
  background: linear-gradient(135deg, #87CEEB, #98FB98);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px;
}

/* ===== 标题栏 (chat-specific: with ::after glow + avatar-wrap) ===== */
.title-bar {
  background: var(--gradient-header, linear-gradient(135deg, var(--color-primary), var(--color-primary-light)));
  padding: 44px 14px 10px; display: flex; align-items: center; gap: 10px;
  color: #fff; position: relative; overflow: hidden; z-index: 10;
  border-radius: 0 0 20px 20px;
}
.title-bar::after {
  content: ''; position: absolute; top: -20%; right: -20%;
  width: 60%; height: 150%;
  background: radial-gradient(ellipse, rgba(255,255,255,0.08) 0%, transparent 70%);
  pointer-events: none;
}
.title-bar .back {
  cursor: pointer; text-decoration: none; color: #fff;
  padding: 4px; position: relative; z-index: 1;
  display: flex; align-items: center;
}
.title-bar .back svg { width: 20px; height: 20px; }
.title-bar .avatar-wrap {
  width: 40px; height: 40px; border-radius: 50%;
  background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center;
  position: relative; z-index: 1; overflow: visible;
}
/* 头像编辑 */
.title-bar .avatar-wrap .avatar-edit-badge {
  position: absolute; bottom: -3px; right: -3px;
  width: 18px; height: 18px; border-radius: 50%;
  background: #fff; color: #F472B6;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  cursor: pointer; z-index: 2;
}
.title-bar .avatar-wrap .avatar-edit-badge svg { width: 10px; height: 10px; }
.title-bar .avatar-wrap img {
  width: 40px; height: 40px; border-radius: 50%; object-fit: cover;
}
.title-bar .info { flex: 1; position: relative; z-index: 1; }
.title-bar .name { font-size: 16px; font-weight: 700; }
.title-bar .status { font-size: 11px; opacity: 0.8; display: flex; align-items: center; gap: 4px; }
.title-bar .status .dot { width: 6px; height: 6px; border-radius: 50%; background: #fff; display: inline-block; }
.title-bar .status .dot.off { background: rgba(255,255,255,0.35); }
.title-bar .menu {
  cursor: pointer; position: relative; z-index: 1; padding: 4px;
  display: flex; align-items: center; color: #fff; text-decoration: none;
}
.title-bar .menu svg { width: 20px; height: 20px; }

/* ===== 消息列表 ===== */
.message-list {
  flex: 1; overflow-y: auto; padding: 14px 16px;
  display: flex; flex-direction: column; gap: 10px;
  position: relative; z-index: 1;
  overscroll-behavior: contain;
}
.time-divider {
  text-align: center; font-size: 11px; color: #C0A0B0; margin: 6px 0;
}

/* 消息行 */
.msg-row { display: flex; gap: 8px; max-width: 84%; }
.msg-row.me { align-self: flex-end; flex-direction: row-reverse; }
.msg-avatar {
  width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  position: relative; overflow: visible;
}
.msg-avatar img {
  width: 30px; height: 30px; border-radius: 50%; object-fit: cover;
}
.msg-avatar.bot {
  background: linear-gradient(135deg, #FFD0DA, #FFE4EA);
  box-shadow: 0 2px 6px rgba(244, 114, 182,0.15);
}
.msg-avatar.user {
  background: linear-gradient(135deg, #7C5CBF, #9B7ED8);
  color: #fff; font-weight: 700; font-size: 12px;
}

/* 气泡 */
.bubble { padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.6; word-break: break-word; }
.bubble.bot {
  background: #fff; color: #4A3040;
  border-bottom-left-radius: 6px;
  box-shadow: 0 2px 10px rgba(244, 114, 182,0.06);
}
.bubble.me {
  background: linear-gradient(135deg, #F472B6, #F9A8D4);
  color: #fff; border-bottom-right-radius: 6px;
}
.bubble .time { font-size: 10px; opacity: 0.45; margin-top: 4px; }

/* Bubble entrance animation classes */
.bubble.anim-in {
  animation: bubble-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}
.msg-row.me .bubble.anim-in {
  animation: bubble-in-me 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}
/* Staggered entrance for existing messages */
.msg-row.stagger-in { opacity: 0; animation: bubble-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
.msg-row.me.stagger-in { animation-name: bubble-in-me; }

/* 打字指示器 */
.typing-dots { display: flex; gap: 4px; padding: 4px 0; }
.typing-dots span {
  width: 7px; height: 7px; border-radius: 50%;
  background: #F472B6;
  animation: type-bounce 1.2s ease-in-out infinite;
}
.typing-dots span:nth-child(2) { animation-delay: 0.15s; }
.typing-dots span:nth-child(3) { animation-delay: 0.3s; }

/* 流式光标 */
.cursor {
  display: inline-block; width: 2px; height: 15px;
  background: #F472B6; vertical-align: text-bottom;
  animation: blink 1s infinite;
}

/* ===== 输入栏 — ChatGPT 风格统一胶囊 ===== */
.input-bar {
  background: #fff;
  margin: 0 12px 12px;
  padding: 5px 5px 5px 14px;
  display: flex;
  align-items: center;
  gap: 4px;
  border: 1px solid rgba(0,0,0,0.08);
  border-radius: 26px;
  position: relative;
  z-index: 10;
  transition: bottom 0.2s ease; /* A3：键盘跟随过渡 */
  box-shadow: 0 1px 6px rgba(0,0,0,0.04), 0 2px 16px rgba(0,0,0,0.03);
  transition: border-color 0.2s ease,
              box-shadow 0.2s ease,
              margin 0.35s ease,
              transform 0.35s var(--ease-spring, cubic-bezier(0.34, 1.56, 0.64, 1));
  transform: scale(0.96);
}
.input-bar:focus-within {
  border-color: rgba(0,0,0,0.18);
  box-shadow: 0 1px 8px rgba(0,0,0,0.06), 0 3px 24px rgba(0,0,0,0.05);
  transform: scale(1);
}
/* 输入框随内容自动展开（不用 focus 固定高度） */
/* JS 在 input 事件中动态设 height = scrollHeight */

/* A3：键盘弹出时输入框通过 JS translateY 上移（Native 键盘高度检测） */
/* 旧的 .phone.keyboard-open .input-bar fixed 定位方案已替换 */

/* A7：语音脉冲动画 */
@keyframes voicePulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(1.3); }
}

/* 附件按钮 */
.input-bar .attach-btn {
  width: 32px; height: 32px; border-radius: 50%;
  background: transparent; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: #9A8A90; transition: all 0.15s ease; flex-shrink: 0;
  touch-action: manipulation;
}
.input-bar .attach-btn:hover { background: rgba(0,0,0,0.04); color: #5A4A50; }
.input-bar .attach-btn:active { transform: scale(0.9); background: rgba(0,0,0,0.08); }
.input-bar .attach-btn svg { width: 18px; height: 18px; }

/* 输入框 — 无边框融入胶囊 */
.input-bar textarea {
  flex: 1; border: none; background: transparent;
  border-radius: 0; padding: 6px 0; font-size: 14px; font-family: inherit;
  resize: none; outline: none; max-height: 90px; min-height: 24px; line-height: 1.5;
  color: #1A1A1A;
  transition: height 0.15s ease;
  touch-action: manipulation;
}
.input-bar textarea::placeholder { color: #B0A0A8; }

/* 发送按钮 — 黑色圆形 (ChatGPT 风格) */
/* ===== ChatGPT 风格输入胶囊：🎤 ↔ ✈️ 变形按钮 ===== */
.input-actions {
  position: relative; width: 34px; height: 34px; flex-shrink: 0;
}
.input-actions .action-btn {
  position: absolute; top: 0; left: 0;
  width: 34px; height: 34px; border-radius: 50%; border: none;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; touch-action: manipulation;
  transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1),
              transform 0.3s cubic-bezier(0.4, 0, 0.2, 1),
              visibility 0.3s;
}
.input-actions .action-btn svg { width: 16px; height: 16px; pointer-events: none; }

/* 纸飞机发送按钮 */
.send-btn {
  width: 34px; height: 34px; border-radius: 50%;
  background: #F472B6; border: none;
  color: #fff; cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  touch-action: manipulation;
  opacity: 1; transform: scale(1) rotate(0deg); visibility: visible;
}
.send-btn:hover { background: #E85D75; }
.send-btn:active { transform: scale(0.9) !important; transition-duration: 0.08s !important; }
.send-btn.sending { animation: send-pulse-gpt 0.6s ease-in-out; pointer-events: none; }
.send-btn svg { width: 16px; height: 16px; }

/* 麦克风按钮 */
.mic-btn {
  width: 34px; height: 34px; border-radius: 50%;
  background: #E8E8E8; border: none;
  color: #999; cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  touch-action: manipulation;
  opacity: 0; transform: scale(0.7) rotate(45deg); visibility: hidden; pointer-events: none;
}
.mic-btn:hover { background: #DDD; color: #666; }
.mic-btn:active { transform: scale(0.9) !important; transition-duration: 0.08s !important; }
.mic-btn.recording {
  background: #F472B6; color: #fff;
  animation: mic-pulse 0.8s ease-in-out infinite;
}

/* 空输入 → 纸飞机始终可见（语音已屏蔽） */
.input-bar.empty .send-btn { opacity: 1; transform: scale(1) rotate(0deg); visibility: visible; pointer-events: auto; }
.input-bar.empty .mic-btn  { display: none; }

/* 麦克风录音脉冲 */
@keyframes mic-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(244,114,182,0.4); }
  50%      { box-shadow: 0 0 0 10px rgba(244,114,182,0); }
}

/* Bot 消息内的猫娘 mini 头像 */
.msg-avatar .img-sm { transform: scale(0.72); }

/* ===== 消息状态图标 ===== */
.msg-status { font-size: 10px; margin-top: 2px; text-align: right; }
.msg-status.sent { color: rgba(255,255,255,0.6); }
.msg-status.read { color: rgba(255,255,255,0.8); }
.msg-status.fail { color: #FFB347; cursor: pointer; }

/* ===== 图片消息 ===== */
.img-msg {
  width: 160px; height: 110px; border-radius: 12px;
  background: linear-gradient(135deg, #FFE0E8, #FFD4DC, #E8E0F8);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; color: #B090A0; cursor: pointer;
  transition: all 0.2s;
}
.img-msg:hover { opacity: 0.85; }

/* ===== 撤回提示 ===== */
.recall-hint {
  text-align: center; font-size: 11px; color: #C0A0B0; font-style: italic;
  padding: 4px 0;
}

/* ===== 长按菜单 ===== */
.longpress-menu {
  position: absolute; background: #fff; border-radius: 14px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.14); padding: 6px; z-index: 30;
  display: none; flex-direction: column; gap: 2px;
  min-width: 120px;
}
.longpress-menu.show {
  display: flex;
  animation: menu-spring-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}
.longpress-menu .lp-item {
  padding: 11px 18px; font-size: 13px; color: #3A2030; cursor: pointer;
  border-radius: 10px; white-space: nowrap; border: none; background: none;
  font-family: inherit; text-align: left;
  transition: all 0.15s ease;
}
.longpress-menu .lp-item:active { background: #FFF0F3; transform: scale(0.96); }
.longpress-menu .lp-item:hover { background: #FFF0F3; }
.longpress-menu .lp-item.danger { color: #F472B6; font-weight: 600; }

/* ===== 页面专用暗色模式覆盖 ===== */
/* (Most are handled by shared/dark-mode.css: bubbles, input-bar, bottom-nav, title-bar, longpress-menu, bg-picker, offline-banner) */

/* ===== 消息列表滚动条 — 窄条 + 低不透明度 ===== */
.message-list {
  scrollbar-width: thin;
  scrollbar-color: rgba(0, 0, 0, 0.1) transparent;
}
.message-list::-webkit-scrollbar {
  width: 3px;
}
.message-list::-webkit-scrollbar-track {
  background: transparent;
}
.message-list::-webkit-scrollbar-thumb {
  background: rgba(0, 0, 0, 0.1);
  border-radius: 3px;
}
.message-list::-webkit-scrollbar-thumb:hover {
  background: rgba(0, 0, 0, 0.18);
}
/* Dark mode */
.phone.dark-mode .message-list {
  scrollbar-color: rgba(255, 255, 255, 0.08) transparent;
}
.phone.dark-mode .message-list::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.08);
}
.phone.dark-mode .message-list::-webkit-scrollbar-thumb:hover {
  background: rgba(255, 255, 255, 0.14);
}

/* ===== 上传面板 — 底部选项弹窗 ===== */
.upload-sheet .upload-option {
  display: flex; align-items: center; gap: 14px; width: 100%;
  padding: 15px 16px; border: none; background: none;
  font-size: 15px; font-weight: 600; color: #3A2030;
  cursor: pointer; font-family: inherit; border-radius: 16px;
  transition: background 0.2s;
}
.upload-sheet .upload-option:hover { background: #FFF0F3; }
.upload-sheet .upload-option:active { background: rgba(244, 114, 182, 0.08); }
.upload-sheet .uo-icon {
  width: 42px; height: 42px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0;
}
.uo-icon.uo-image { background: rgba(244, 114, 182, 0.1); }
.uo-icon.uo-camera { background: rgba(196, 181, 253, 0.15); }
.uo-icon.uo-file { background: rgba(173, 216, 230, 0.15); }

/* ===== 图片消息 — 真实缩略图 ===== */
.msg-img {
  max-width: 200px; max-height: 200px; border-radius: 12px;
  cursor: pointer; object-fit: cover; display: block;
  transition: opacity 0.2s;
}
.msg-img:hover { opacity: 0.88; }
.msg-img:active { opacity: 0.75; }

/* ===== 文件消息卡片 ===== */
.msg-file {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; background: rgba(0, 0, 0, 0.03);
  border-radius: 12px; cursor: pointer; min-width: 170px;
  transition: background 0.2s;
}
.msg-file:hover { background: rgba(0, 0, 0, 0.06); }
.msg-file .file-icon {
  width: 38px; height: 38px; border-radius: 10px;
  background: rgba(244, 114, 182, 0.1);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0;
}
.msg-file .file-info { flex: 1; min-width: 0; }
.msg-file .file-name {
  font-size: 13px; font-weight: 600; color: #3A2030;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.msg-file .file-size {
  font-size: 11px; color: #B090A0; margin-top: 2px;
}

/* ===== 图片预览灯箱 ===== */
.img-lightbox {
  position: absolute; inset: 0; z-index: 200;
  background: rgba(0, 0, 0, 0.88); backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; animation: lb-fade-in 0.2s ease;
}
@keyframes lb-fade-in {
  from { opacity: 0; }
  to   { opacity: 1; }
}
.img-lightbox img {
  max-width: 90%; max-height: 80%; border-radius: 12px;
  box-shadow: 0 8px 40px rgba(0, 0, 0, 0.35);
  animation: lb-img-in 0.3s var(--ease-spring, cubic-bezier(0.34, 1.56, 0.64, 1));
}
@keyframes lb-img-in {
  from { transform: scale(0.9); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}

/* Dark mode */
.phone.dark-mode .upload-option { color: #E0D8E8; }
.phone.dark-mode .upload-option:hover { background: rgba(249, 168, 212, 0.08); }
.phone.dark-mode .msg-file { background: rgba(255, 255, 255, 0.04); }
.phone.dark-mode .msg-file:hover { background: rgba(255, 255, 255, 0.08); }
.phone.dark-mode .msg-file .file-name { color: #E0D8E8; }
.phone.dark-mode .msg-file .file-size { color: #9088A0; }
.phone.dark-mode .msg-file .file-icon { background: rgba(249, 168, 212, 0.12); }
</style>
</head>
<body>
<div class="phone" id="phoneFrame">
  <!-- 自定义聊天壁纸层 -->
  <div class="chat-bg" id="chatBg"></div>

  <!-- 壁纸选择器 -->
  <div class="bg-picker" id="bgPicker">
    <div class="bg-opt" style="background:linear-gradient(135deg,#FFE0E8,#FFD4DC);" onclick="setChatBg('', this)" title="默认"></div>
    <div class="bg-opt" style="background:linear-gradient(135deg,#E8E0F8,#D4CCF0);" onclick="setChatBg('linear-gradient(135deg,#E8E0F8,#D4CCF0)', this)" title="紫藤"></div>

<script>
// ===== Staggered Entrance on Load =====
(function(){
  var rows = document.querySelectorAll('#messageList > .msg-row');
  rows.forEach(function(row, i) {
    row.classList.add('stagger-in');
    row.style.animationDelay = (i * 0.06) + 's';
  });
})();

function toggleBgPicker() {
  document.getElementById('bgPicker').classList.toggle('show');
}

// 点 picker 外部区域时关闭 picker（让用户能连续选颜色，点别处才收起）
document.addEventListener('click', function(e) {
  var picker = document.getElementById('bgPicker');
  if (!picker || !picker.classList.contains('show')) return;
  // 如果点击的不是 picker 内部、也不是触发按钮，则关闭
  if (!picker.contains(e.target) && !e.target.closest('[onclick*="toggleBgPicker"]')) {
    picker.classList.remove('show');
  }
});

var CHAT_BG_KEY = 'chatBg';

function applyChatBgToOverlay(bgData) {
  var bgEl = document.getElementById('chatBg');
  var phone = document.getElementById('phoneFrame');
  // 清除 overlay
  if (bgEl) {
    bgEl.style.backgroundImage = '';
    bgEl.style.backgroundColor = '';
    bgEl.style.opacity = '';
    bgEl.style.backgroundSize = '';
    bgEl.style.backgroundPosition = '';
  }
  // 清除 phone 背景
  if (phone) {
    phone.style.background = '';
    if (!phone.classList.contains('dark-mode')) phone.style.background = '#FFF5F7';
  }
  if (!bgData || bgData.type === 'default' || !bgData.value) {
    // 默认背景已在上方设置
    return;
  }
  if (bgData.type === 'custom') {
    if (bgEl) {
      bgEl.style.backgroundImage = 'url(' + bgData.value + ')';
      bgEl.style.backgroundSize = 'cover';
      bgEl.style.backgroundPosition = 'center';
      bgEl.style.opacity = '0.18';
    }
    if (phone) phone.style.setProperty('background', 'url(' + bgData.value + ') center/cover no-repeat', 'important');
    console.log('[chatBg] applied custom bg');
  } else if (bgData.type === 'dark') {
    if (bgEl) {
      bgEl.style.backgroundColor = bgData.value;
      bgEl.style.opacity = '0.08';
    }
    if (phone) phone.style.setProperty('background', bgData.value, 'important');
    console.log('[chatBg] applied dark bg:', bgData.value);
  } else {
    if (bgEl) {
      bgEl.style.backgroundImage = bgData.value;
      bgEl.style.opacity = '0.12';
    }
    if (phone) phone.style.setProperty('background', bgData.value, 'important');
    console.log('[chatBg] applied gradient bg');
  }
}

function setChatBg(bg, el) {
  var bgData = { type: 'default', value: '' };
  if (bg === '📷') {
    document.getElementById('chatBgFileInput').click();
    document.querySelectorAll('.bg-opt').forEach(function(o) { o.style.borderColor = 'transparent'; });
    document.getElementById('bgPicker').classList.remove('show');
    return;
  } else if (bg) {
    bgData = { type: bg.startsWith('#') ? 'dark' : 'gradient', value: bg };
  }
  localStorage.setItem(CHAT_BG_KEY, JSON.stringify(bgData));
  console.log('[chatBg] set: type=' + bgData.type + ' val=' + (bgData.value || 'default').substring(0,30));
  applyChatBgToOverlay(bgData);
  document.querySelectorAll('.bg-opt').forEach(function(o) { o.style.borderColor = 'transparent'; });
  if (el) el.style.borderColor = '#F472B6';
  // 不再自动关闭 picker — 让用户连续切换多个颜色对比，
  // 点 picker 外部区域时由 toggleBgPicker 关闭（修复"选黑色后无法切其他颜色"）
}

function handleChatBgFileImport(e) {
  var file = e.target.files[0];
  if (!file) return;
  if (!file.type.match(/image\/(jpeg|png|webp|gif|bmp)/)) {
    showToast('仅支持 JPG/PNG/WebP/GIF 图片格式', 'error');
    return;
  }
  var reader = new FileReader();
  reader.onload = function(ev) {
    var dataUrl = ev.target.result;
    if (dataUrl.length > 500 * 1024) {
      var img = new Image();
      img.onload = function() {
        var canvas = document.createElement('canvas');
        var scale = Math.min(720 / img.width, 1600 / img.height, 1);
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        dataUrl = canvas.toDataURL('image/jpeg', 0.75);
        saveChatBgCustom(dataUrl);
      };
      img.src = dataUrl;
    } else {
      saveChatBgCustom(dataUrl);
    }
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

function saveChatBgCustom(dataUrl) {
  var bgData = { type: 'custom', value: dataUrl };
  localStorage.setItem(CHAT_BG_KEY, JSON.stringify(bgData));
  applyChatBgToOverlay(bgData);
  document.querySelectorAll('.bg-opt').forEach(function(o) { o.style.borderColor = 'transparent'; });
  showToast('聊天背景已全局同步', 'success');
}

function loadChatBg() {
  try {
    var raw = localStorage.getItem(CHAT_BG_KEY);
    console.log('[chatBg] loadChatBg: raw=' + (raw ? raw.substring(0,40) : 'null'));
    if (!raw) { console.log('[chatBg] no saved bg'); return; }
    var bgData = JSON.parse(raw);
    applyChatBgToOverlay(bgData);
    var matchVal = bgData.value;
    document.querySelectorAll('.bg-opt').forEach(function(o) {
      o.style.borderColor = 'transparent';
      if (bgData.type === 'default' && o.getAttribute('onclick') && o.getAttribute('onclick').indexOf("''") > -1) {
        o.style.borderColor = '#F472B6';
      } else if (o.style.background === matchVal || (bgData.type === 'dark' && o.style.background === matchVal)) {
        o.style.borderColor = '#F472B6';
      }
    });
  } catch(e) {}
}

// ===== 🎤↔✈️ 输入监听：空输入显示麦克风，有文字变形为纸飞机 =====
(function(){
  var inputBox = document.getElementById('inputBox');
  var inputBar = document.getElementById('inputBar');
  if (inputBox && inputBar) {
    inputBox.addEventListener('input', function() {
      // 空/有内容切换麦克风↔发送按钮
      if (this.value.trim().length > 0) {
        inputBar.classList.remove('empty');
      } else {
        inputBar.classList.add('empty');
      }
      // 随内容自动变高
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 110) + 'px';
    });
  }
})();

var recordingTimer = null;
function startRecording() {
  var micBtn = document.getElementById('micBtn');
  if (micBtn) micBtn.classList.add('recording');
  recordingTimer = setTimeout(function() {
    var micBtn2 = document.getElementById('micBtn');
    if (micBtn2) micBtn2.classList.remove('recording');
    var box = document.getElementById('inputBox');
    if (box) { box.value = '🎤 语音消息（模拟）'; box.dispatchEvent(new Event('input')); }
    if (typeof showToast === 'function') showToast('语音录制完成', 'success');
  }, 1500);
}
function stopRecording() {
  clearTimeout(recordingTimer);
  var micBtn = document.getElementById('micBtn');
  if (micBtn) micBtn.classList.remove('recording');
}

// ===== 上传功能 =====
function showUploadSheet() {
  document.getElementById('uploadSheet').classList.remove('hidden');
}
function closeUploadSheet() {
  document.getElementById('uploadSheet').classList.add('hidden');
}
function handleUploadImage() {
  closeUploadSheet();
  document.getElementById('uploadImageInput').click();
}
function handleUploadCamera() {
  closeUploadSheet();
  document.getElementById('uploadCameraInput').click();
}
function handleUploadFile() {
  closeUploadSheet();
  document.getElementById('uploadFileInput').click();
}

function handleFileSelected(e, type) {
  var file = e.target.files[0];
  if (!file) return;

  var list = document.getElementById('messageList');
  var now = new Date();
  var time = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

  if (type === 'image') {
    if (!file.type.match(/image\//)) {
      if (typeof showToast === 'function') showToast('请选择图片文件', 'error');
      e.target.value = '';
      return;
    }
    // A2：先本地预览（dataURL），同时上传到后端，上传成功后替换为持久 URL
    var reader = new FileReader();
    reader.onload = function(ev) {
      var dataUrl = ev.target.result;
      // 大图压缩到 400px + JPEG
      var processAndShow = function(src) {
        if (src.length > 500 * 1024) {
          var img = new Image();
          img.onload = function() {
            var canvas = document.createElement('canvas');
            var maxW = 400, maxH = 400;
            var scale = Math.min(maxW / img.width, maxH / img.height, 1);
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            var ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            appendImageMessage(list, canvas.toDataURL('image/jpeg', 0.72), file.name, time);
          };
          img.src = src;
        } else {
          appendImageMessage(list, src, file.name, time);
        }
      };
      processAndShow(dataUrl); // 即时本地预览

      // 上传到后端，成功后替换预览为持久URL
      if (typeof API !== 'undefined' && API.uploadChatImage && window._chat && window._chat.botId) {
        var imgRow = list.lastElementChild;
        API.uploadChatImage(window._chat.botId, file).then(function(r) {
          // 替换本地预览为服务器URL，切换页面后不会消失
          if (imgRow && r.url) {
            var imgEl = imgRow.querySelector('.msg-img');
            if (imgEl) { imgEl.src = _resolveUrl(r.url); imgEl.setAttribute('data-persist', '1'); }
          }
          if (typeof showToast === 'function') showToast('图片已上传');
        }).catch(function(err) {
          if (typeof showToast === 'function') showToast('图片上传失败: ' + (err.message || ''));
        });
      }
    };
    reader.readAsDataURL(file);
  } else {
    // 文件消息
    appendFileMessage(list, file.name, file.size, time);
  }

  e.target.value = '';
}

function appendImageMessage(list, dataUrl, fileName, time) {
  var row = document.createElement('div');
  row.className = 'msg-row me';
  row.innerHTML =
    '<div class="msg-avatar user">我</div>' +
    '<div class="bubble me" style="padding:5px;background:transparent;box-shadow:none;">' +
    '<img class="msg-img" src="' + dataUrl + '" alt="' + fileName.replace(/"/g, '&quot;') + '" onclick="previewImage(this.src)" loading="lazy">' +
    '<div style="display:flex;justify-content:flex-end;align-items:center;gap:4px;padding:2px 4px 0;">' +
    '<span class="time" style="color:rgba(255,255,255,0.6);">' + time + '</span>' +
    '<span style="font-size:10px;opacity:0.4;">✓</span>' +
    '</div></div>';
  list.appendChild(row);
  list.scrollTo({ top: list.scrollHeight, behavior: 'smooth' });
}

function appendFileMessage(list, fileName, fileSize, time) {
  var ext = fileName.split('.').pop().toLowerCase();
  var icon = '📄';
  if (/pdf/i.test(ext)) icon = '📕';
  else if (/doc|docx/i.test(ext)) icon = '📝';
  else if (/xls|xlsx|csv/i.test(ext)) icon = '📊';
  else if (/ppt|pptx/i.test(ext)) icon = '📽';
  else if (/zip|rar|7z|tar|gz/i.test(ext)) icon = '📦';
  else if (/mp3|wav|ogg|flac/i.test(ext)) icon = '🎵';
  else if (/mp4|mov|avi|mkv/i.test(ext)) icon = '🎬';
  else if (/txt|md|log/i.test(ext)) icon = '📃';

  var row = document.createElement('div');
  row.className = 'msg-row me';
  row.innerHTML =
    '<div class="msg-avatar user">我</div>' +
    '<div class="bubble me" style="padding:6px;">' +
    '<div class="msg-file">' +
    '<div class="file-icon">' + icon + '</div>' +
    '<div class="file-info">' +
    '<div class="file-name">' + fileName.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;') + '</div>' +
    '<div class="file-size">' + formatFileSize(fileSize) + '</div>' +
    '</div></div>' +
    '<div class="time" style="margin-top:4px;">' + time + '</div>' +
    '</div>';
  list.appendChild(row);
  list.scrollTo({ top: list.scrollHeight, behavior: 'smooth' });
}

function formatFileSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

function previewImage(src) {
  var lb = document.createElement('div');
  lb.className = 'img-lightbox';
  lb.setAttribute('aria-label', '图片预览');
  lb.setAttribute('role', 'dialog');
  lb.innerHTML = '<img src="' + src + '" alt="预览图片">';
  lb.onclick = function() { lb.remove(); };
  // ESC 关闭
  lb.setAttribute('tabindex', '0');
  lb.onkeydown = function(e) { if (e.key === 'Escape') { lb.remove(); } };
  document.getElementById('phoneFrame').appendChild(lb);
  lb.focus();
}

// Upload sheet: click mask to close
document.addEventListener('click', function(e) {
  if (e.target.id === 'uploadSheet') {
    document.getElementById('uploadSheet').classList.add('hidden');
  }
});

function sendMessage() {
  var box = document.getElementById('inputBox');
  var text = box.value.trim();
  if (!text) return;
  box.value = '';
  box.style.height = 'auto';
  // 触发 input 事件切回麦克风
  box.dispatchEvent(new Event('input'));

  var sendBtn = document.querySelector('.send-btn');
  sendBtn.classList.add('sending');
  setTimeout(function(){ sendBtn.classList.remove('sending'); }, 600);

  var list = document.getElementById('messageList');
  var now = new Date();
  var time = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');

  // 用户消息（本地立即显示，ack 到达后回填 msg-id）
  var userMsg = document.createElement('div');
  userMsg.className = 'msg-row me';
  userMsg.innerHTML = '<div class="msg-avatar user">我</div><div class="bubble me anim-in" data-pending="1">'+escapeHtml(text)+'<div class="time">'+time+' <span style="font-size:9px;opacity:0.5;">✓</span></div></div>';
  list.appendChild(userMsg);

  // Bot 气泡占位（typing dots，收到首个 token 后清掉换成流式文本 + 光标）
  var botMsg = document.createElement('div');
  botMsg.className = 'msg-row';
  botMsg.style.opacity = '0';
  botMsg.innerHTML = '<div class="msg-avatar bot"><div class="img-cat avatar img-sm"><img src="shared/agnes-cat.png" alt="猫娘"></div></div><div class="bubble bot"><div class="typing-dots"><span></span><span></span><span></span></div></div>';
  list.appendChild(botMsg);
  requestAnimationFrame(function() {
    botMsg.style.transition = 'opacity 0.2s ease';
    botMsg.style.opacity = '1';
  });
  list.scrollTop = list.scrollHeight;

  // 记录到 pendingBotBubble，WS onToken/onDone 会填充它
  window._chat.pendingBotBubble = botMsg;
  botMsg._typingShown = true;

  // 通过 WS 发送（client_id 幂等去重）
  var clientId = API.newClientId();
  try {
    if (!API.wsReady()) {
      // WS 未就绪 → 提示并尝试重连
      if (typeof showToast === 'function') showToast('连接中，请稍候...');
      connectWs();
      // 1s 后若已就绪则补发
      setTimeout(function() {
        if (API.wsReady()) {
          API.sendMsg(window._chat.botId, text, clientId);
        } else {
          var b = window._chat.pendingBotBubble;
          if (b) b.querySelector('.bubble.bot').innerHTML = '<div class="stream-text">(未连接服务器，请重试)</div>';
          window._chat.pendingBotBubble = null;
        }
      }, 1000);
    } else {
      API.sendMsg(window._chat.botId, text, clientId);
    }
  } catch (e) {
    if (typeof showToast === 'function') showToast('发送失败: ' + e.message);
    if (botMsg) botMsg.querySelector('.bubble.bot').innerHTML = '<div class="stream-text">(发送失败)</div>';
    window._chat.pendingBotBubble = null;
  }
}

// typing → 流式文本切换：首个 token 到达时调用（由 onToken 间接触发）
// 在 onToken 里检查 pendingBotBubble._typingShown，若是则替换 typing dots
var _origOnToken = null;
</script>

<script>
// ===== 长按菜单（事件委托，支持动态消息）=====
(function(){
  var menu = null;
  var longPressTimer = null;

  // 事件委托：在 messageList 上监听，而非逐个 bubble 绑定
  var list = document.getElementById('messageList');
  if (!list) return;

  function getBubble(target) {
    return target.closest('.bubble.bot, .bubble.me');
  }

  list.addEventListener('touchstart', function(e) {
    var bubble = getBubble(e.target);
    if (!bubble) return;
    longPressTimer = setTimeout(function() {
      showLongPressMenu(e, bubble);
    }, 500);
  });
  list.addEventListener('touchend', function() { clearTimeout(longPressTimer); });
  list.addEventListener('touchmove', function() { clearTimeout(longPressTimer); });
  list.addEventListener('contextmenu', function(e) {
    var bubble = getBubble(e.target);
    if (!bubble) return;
    e.preventDefault();
    showLongPressMenu(e, bubble);
  });

  function showLongPressMenu(e, bubble) {
    if (menu) menu.remove();
    menu = document.createElement('div');
    menu.className = 'longpress-menu show';
    var clientX = e.clientX || (e.touches && e.touches[0] && e.touches[0].clientX) || 100;
    var clientY = e.clientY || (e.touches && e.touches[0] && e.touches[0].clientY) || 100;
    menu.style.left = Math.min(clientX, window.innerWidth - 140) + 'px';
    menu.style.top = Math.min(clientY, window.innerHeight - 120) + 'px';
    menu.style.position = 'fixed';

    var isOwn = bubble.classList.contains('me');
    var items = isOwn ? ['复制', '撤回', '删除'] : ['复制', '举报'];

    items.forEach(function(item, i) {
      var btn = document.createElement('button');
      btn.className = 'lp-item' + (item === '删除' || item === '举报' ? ' danger' : '');
      btn.textContent = item;
      btn.style.animationDelay = (i * 0.04) + 's';
      btn.onclick = function() { handleMenuAction(item, bubble); menu.remove(); menu = null; };
      menu.appendChild(btn);
    });
    document.body.appendChild(menu);
  }

  function handleMenuAction(item, bubble) {
    var msgId = bubble.getAttribute('data-msg-id');

    if (item === '复制') {
      var text = bubble.textContent || '';
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function() {
          showToast('已复制到剪贴板', 'success');
        }).catch(function() { showToast('已复制', 'success'); });
      } else {
        showToast('已复制', 'success'); // WebView 降级
      }
      return;
    }

    if (item === '撤回') {
      if (!msgId) {
        // 本地消息（WS 未返回 ack 的消息）
        bubble.innerHTML = '<span style="color:#C0A0B0;font-style:italic;">你撤回了一条消息</span>';
        bubble.style.background = 'transparent';
        bubble.removeAttribute('data-msg-id');
        bubble.setAttribute('data-recalled', '1');
        showToast('消息已撤回', 'info');
        return;
      }
      API.recallMessage(msgId).then(function() {
        bubble.innerHTML = '<span style="color:#C0A0B0;font-style:italic;">你撤回了一条消息</span>';
        bubble.style.background = 'transparent';
        bubble.setAttribute('data-recalled', '1');
        showToast('消息已撤回', 'info');
      }).catch(function(e) {
        showToast('撤回失败: ' + e.message, 'error');
      });
      return;
    }

    if (item === '删除') {
      if (!msgId) {
        bubble.closest('.msg-row').remove();
        showToast('消息已删除', 'info');
        return;
      }
      API.deleteMessage(msgId).then(function() {
        bubble.closest('.msg-row').remove();
        showToast('消息已删除', 'info');
      }).catch(function(e) {
        showToast('删除失败: ' + e.message, 'error');
      });
      return;
    }

    if (item === '举报') {
      if (!msgId) {
        showToast('暂无法举报此消息', 'error');
        return;
      }
      API.reportMessage(msgId, '用户举报').then(function() {
        showToast('已提交举报，我们会尽快处理', 'success');
      }).catch(function(e) {
        showToast('举报失败: ' + e.message, 'error');
      });
      return;
    }
  }

  document.addEventListener('click', function(e) {
    if (menu && !menu.contains(e.target)) { menu.remove(); menu = null; }
  });
})();
</script>

<script>
// 补全服务器URL前缀：相对路径 → 绝对路径
function _resolveUrl(url) {
  if (!url) return '';
  if (url.indexOf('http') === 0 || url.indexOf('data:') === 0 || url.indexOf('blob:') === 0) return url;
  var base = (window.APP_CONFIG && window.APP_CONFIG.server_base) || '';
  if (base && url.charAt(0) === '/') return base + url;
  if (base) return base + '/' + url;
  return url;
}

// ===== 聊天背景全局同步 (loadChatBg + 跨页由 app.js storage 事件统一管理) =====
loadChatBg();

// ===== 聊天页初始化：拉历史 + 建 WS（对接 8766 真后端）=====
(function() {
  var params = new URLSearchParams(location.search);
  var botId = params.get('bot_id') || API.getCurrentBotId();
  if (!botId) {
    if (typeof showToast === 'function') showToast('未指定 Bot，请先创建');
    setTimeout(function() { location.href = 'Bot创建向导.html'; }, 800);
    return;
  }
  API.setCurrentBotId(botId);

  if (typeof showToast === 'function' && !API.isLoggedIn()) {
    showToast('离线模式：消息功能需要登录');
  }

  window._chat = { botId: parseInt(botId, 10), pendingBotBubble: null, _manualClose: false };

  // 补全右上角设置链接的 bot_id 参数
  var settingsLink = document.getElementById('botSettingsLink');
  if (settingsLink) settingsLink.href = 'Bot设置.html?bot_id=' + botId;

  // A5+A6：拉 Bot 详情回填顶部名 + 人格标签 + 头像
  API.getBot(botId).then(function(bot) {
    window._chat.bot = bot; // 存供消息渲染用
    var nameEl = document.querySelector('.title-bar .name');
    if (nameEl && bot.name) nameEl.textContent = bot.name;
    // A5：人格标签 + 在线状态（读 bot.is_active，不再硬编码“在线”）
    var personaLabels = { tsundere: '傲娇', gentle: '温柔', sarcastic: '毒舌', energetic: '元气', emotionless: '三无', sly: '腹黑' };
    var personaEl = document.querySelector('.title-bar .persona-tag, .title-bar .status');
    if (personaEl) {
      var label = bot.personality ? (personaLabels[bot.personality] || bot.personality) : '';
      // 基于 is_active 显示真实状态
      var isBotActive = bot.is_active !== false;
      var statusText = isBotActive ? '在线' : '已停用';
      personaEl.innerHTML = '<span class="dot"></span> ' + (label ? label + ' · ' + statusText : statusText);
      console.log('[Chat] bot=' + bot.name + ' avatar_url=' + JSON.stringify(bot.avatar_url) + ' is_active=' + bot.is_active);
    }
    // A6：头像 — 读 avatar_url 或按 personality 映射预设猫娘
    var PERSONA_AVATARS = { tsundere: 'agnes-tsundere.png', gentle: 'agnes-gentle.png', sarcastic: 'agnes-sarcastic.png', energetic: 'agnes-energetic.png', emotionless: 'agnes-emotionless.png', sly: 'agnes-sly.png' };
    var avatarUrl = bot.avatar_url ? _resolveUrl(bot.avatar_url) : ('shared/agnes-' + (PERSONA_AVATARS[bot.personality] ? bot.personality : 'cat') + '.png');
    var fallbackAvatar = 'shared/agnes-' + (PERSONA_AVATARS[bot.personality] ? bot.personality : 'cat') + '.png';
    console.log('[Chat] avatar resolved=' + avatarUrl + ' fallback=' + fallbackAvatar);
    var avImgs = document.querySelectorAll('.title-bar .avatar-wrap img, .msg-avatar img');
    avImgs.forEach(function(img) {
      img.src = avatarUrl;
      img.onerror = function() { this.onerror = null; this.src = fallbackAvatar; };
    });
  }).catch(function() {});

  // 拉历史消息渲染
  API.listMessages(botId).then(function(d) {
    var list = document.getElementById('messageList');
    list.innerHTML = '';  // 无条件清掉静态演示消息（A4：新 bot 空历史时不再残留演示内容）
    if (d && d.messages && d.messages.length > 0) {
      // A1：后端返回 DESC（新→旧），前端 reverse 后正序渲染（旧→新），最新在底部
      d.messages.reverse();
      d.messages.forEach(function(m) { appendHistoryMessage(list, m); });
      // 暴力滚动到底：scrollTop 设极大值，浏览器自动 clamp 到 scrollHeight
      setTimeout(function(){ list.scrollTop = 999999; }, 150);
    } else {
      // A4：空历史显示空状态提示
      list.innerHTML = '<div style="text-align:center;padding:60px 20px;color:#C0A0B0;font-size:13px;line-height:1.8;">还没有聊天记录<br>发条消息开始对话吧 💬</div>';
    }
  }).catch(function(e) {
    if (typeof showToast === 'function') showToast('加载历史失败: ' + e.message);
  });

  connectWs();
})();

function appendHistoryMessage(list, m) {
  var row = document.createElement('div');
  var isUser = m.role === 'user';
  row.className = isUser ? 'msg-row me' : 'msg-row';
  var t = new Date((m.time || 0) * 1000);
  var hh = t.getHours().toString().padStart(2,'0');
  var mm = t.getMinutes().toString().padStart(2,'0');
  // Bot 头像：使用实际 bot avatar_url，而非硬编码默认图
  var botAvatarSrc = 'shared/agnes-cat.png';
  if (window._chat && window._chat.bot && window._chat.bot.avatar_url) {
    botAvatarSrc = _resolveUrl(window._chat.bot.avatar_url);
  }
  var avatar = isUser
    ? '<div class="msg-avatar user">我</div>'
    : '<div class="msg-avatar bot"><div class="img-cat avatar img-sm"><img src="' + botAvatarSrc + '" alt="Bot" onerror="this.onerror=null;this.src=\'shared/agnes-cat.png\'"></div></div>';
  var bubbleClass = isUser ? 'bubble me' : 'bubble bot';
  // 撤回消息渲染
  if (m.recalled) {
    row.innerHTML = avatar + '<div class="' + bubbleClass + '" data-recalled="1">' +
      '<span style="color:#C0A0B0;font-style:italic;">你撤回了一条消息</span></div>';
  } else {
    // 图片消息：检查 content 是否是图片 URL
    var content = m.content || '';
    var isImage = m.type === 'image' || /\.(jpg|jpeg|png|gif|webp|bmp)(\?.*)?$/i.test(content);
    if (isImage && content) {
      var imgUrl = _resolveUrl(content);
      row.innerHTML = avatar + '<div class="' + bubbleClass + '" style="padding:5px;background:transparent;box-shadow:none;">' +
        '<img class="msg-img" src="' + imgUrl + '" alt="图片" onclick="previewImage(this.src)" loading="lazy" style="max-width:200px;max-height:200px;border-radius:12px;cursor:pointer;">' +
        '<div class="time" style="margin-top:4px;">' + hh + ':' + mm + '</div></div>';
    } else {
      row.innerHTML = avatar + '<div class="' + bubbleClass + '">' + escapeHtml(content) + '<div class="time">' + hh + ':' + mm + '</div></div>';
    }
  }
  // 记录 message_id
  var bubbleEl = row.querySelector('.bubble');
  if (bubbleEl && m.id) bubbleEl.setAttribute('data-msg-id', m.id);
  list.appendChild(row);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

// Bot 头像更换
function changeBotAvatar() {
  document.getElementById('botAvatarInput').click();
}
function handleBotAvatarSelected(e) {
  var file = e.target.files && e.target.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) { if (typeof showToast === 'function') showToast('头像最大 2MB'); return; }
  if (typeof API === 'undefined' || !API.uploadBotAvatar) { if (typeof showToast === 'function') showToast('上传功能不可用'); return; }
  var botId = window._chat ? window._chat.botId : null;
  if (!botId) { if (typeof showToast === 'function') showToast('未指定 Bot'); return; }
  if (typeof showToast === 'function') showToast('上传中…');
  API.uploadBotAvatar(botId, file).then(function(r) {
    if (r && r.avatar_url) {
      var fullUrl = _resolveUrl(r.avatar_url);
      var avImgs = document.querySelectorAll('.title-bar .avatar-wrap img, .msg-avatar.bot img');
      avImgs.forEach(function(img) { img.src = fullUrl; });
      // 更新内存中的 bot 对象
      if (window._chat && window._chat.bot) window._chat.bot.avatar_url = r.avatar_url;
      if (typeof showToast === 'function') showToast('头像已更新');
    }
  }).catch(function(err) {
    if (typeof showToast === 'function') showToast('上传失败：' + (err.message || '未知错误'));
  });
  e.target.value = '';
}

function connectWs() {
  API.openChatWs({
    onAck: function(f) {
      if (f.duplicate && typeof showToast === 'function') showToast('消息已发送过（去重）');
      // S2修复：ack 帧回填 message_id 到用户气泡
      // 兼容后端字段名：message_id / server_id / msg_id
      var ackId = f.message_id || f.server_id || f.msg_id;
      if (ackId) {
        var pendingBubble = document.querySelector('.bubble.me[data-pending="1"]');
        if (pendingBubble) {
          pendingBubble.setAttribute('data-msg-id', ackId);
          pendingBubble.removeAttribute('data-pending');
        }
      }
    },
    onTyping: function() { /* typing dots 由 sendMessage 本地先建 */ },
    onToken: function(text) {
      var bubble = window._chat.pendingBotBubble;
      if (!bubble) return;
      // 首个 token：把 typing dots 换成流式文本容器 + 光标
      if (bubble._typingShown) {
        bubble.querySelector('.bubble.bot').innerHTML = '<span class="stream-text"></span><span class="cursor">&nbsp;</span>';
        bubble._typingShown = false;
      }
      var el = bubble.querySelector('.stream-text');
      if (el) {
        el.appendChild(document.createTextNode(text));
        var list = document.getElementById('messageList');
        list.scrollTop = list.scrollHeight;
      }
    },
    onDone: function(f) {
      var bubble = window._chat.pendingBotBubble;
      if (bubble) {
        var cursor = bubble.querySelector('.cursor');
        if (cursor) cursor.remove();
        var t = new Date();
        var hh = t.getHours().toString().padStart(2,'0');
        var mm = t.getMinutes().toString().padStart(2,'0');
        bubble.querySelector('.bubble.bot').insertAdjacentHTML('beforeend',
          '<div class="time">' + hh + ':' + mm + '</div>');
        bubble.classList.add('anim-in');
        // S2修复：done 帧回填 message_id 到 bot 气泡
        // 后端设计文档字段名为 server_id，兼容 message_id
        var doneId = f.server_id || f.message_id;
        if (doneId) {
          var botBubble = bubble.querySelector('.bubble.bot');
          if (botBubble) botBubble.setAttribute('data-msg-id', doneId);
        }
        window._chat.pendingBotBubble = null;
        var list = document.getElementById('messageList');
        list.scrollTo({ top: list.scrollHeight, behavior: 'smooth' });
      }
    },
    onError: function(msg) {
      if (typeof showToast === 'function') showToast('聊天错误: ' + msg);
      var bubble = window._chat.pendingBotBubble;
      if (bubble) {
        bubble.querySelector('.bubble.bot').innerHTML = '<div class="stream-text">(回复失败: ' + escapeHtml(msg || '') + ')</div>';
      }
      window._chat.pendingBotBubble = null;
    },
    onClose: function(ev) {
      if (!window._chat._manualClose) {
        setTimeout(function() { if (!window._chat._manualClose) connectWs(); }, 3000);
      }
    },
  });
}

// ===== A3：键盘 — 仅输入栏 position:fixed 浮到键盘上方，其余不动 =====
(function() {
  var inputBar = document.querySelector('.input-bar');
  if (!inputBar) return;
  var origMargin = inputBar.style.margin || '';
  var origBottom = '';
  window._onKeyboardChanged = function(keyboardHCss) {
    if (keyboardHCss > 60) {
      inputBar.style.position = 'fixed';
      inputBar.style.bottom = keyboardHCss + 'px';
      inputBar.style.left = '12px';

      inputBar.style.transition = 'bottom 0.12s ease-out';
      var list = document.getElementById('messageList');
      if (list) setTimeout(function(){ list.scrollTop = 999999; }, 150);
    } else {

      inputBar.style.bottom = '';

    }

})();

// ===== A7：语音输入 — WeChat 风格原生录音 =====
(function() {
  var micBtn = document.getElementById('micBtn') || document.querySelector('[onmousedown*="startRecording"]');
  if (!micBtn) return;
  var isRecording = false;
  var canUseRecording = window.NativeBridge && typeof window.NativeBridge.startRecording === 'function';
  var VOICE_KEY = 'voice_msgs_' + (window._chat ? window._chat.botId : '0');

  // 创建微信风格录音浮层
  var overlay = document.createElement('div');
  overlay.id = 'voiceOverlay';
  overlay.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:999;background:rgba(26,26,46,0.92);border-radius:20px;padding:32px 40px;text-align:center;color:#fff;display:none;flex-direction:column;align-items:center;gap:12px;min-width:140px;';
  overlay.innerHTML = '<div id="voiceDot" style="width:12px;height:12px;border-radius:50%;background:#FF4757;animation:voicePulse 1s infinite;"></div>' +
    '<div style="font-size:15px;font-weight:600;">松开发送</div>' +
    '<div style="font-size:12px;opacity:0.6;">上滑取消</div>' +
    '<div style="font-size:20px;font-weight:700;" id="voiceTime">0:00</div>';
  document.body.appendChild(overlay);

  var voiceTimer = null, voiceSeconds = 0;

  // 页面离开时清理录音状态，防止回调残留到新页面
  window.addEventListener('beforeunload', function() {
    if (isRecording) {
      isRecording = false;
      window._recordingResult = null;
      if (voiceTimer) clearInterval(voiceTimer);
      if (window.NativeBridge && window.NativeBridge.stopRecording) {
        window.NativeBridge.stopRecording();
      }
    }
  });

  window.startRecording = function() {
    if (!canUseRecording) { showToast('原生环境才能录音'); return; }
    var doRecord = function() {
      isRecording = true; micBtn.classList.add('recording');
      overlay.style.display = 'flex'; overlay.style.background = 'rgba(26,26,46,0.92)';
      voiceSeconds = 0; document.getElementById('voiceTime').textContent = '0:00';
      voiceTimer = setInterval(function() {
        voiceSeconds++;
        var m = Math.floor(voiceSeconds/60), s = voiceSeconds%60;
        document.getElementById('voiceTime').textContent = m + ':' + String(s).padStart(2,'0');
        if (voiceSeconds >= 60) window.stopRecording();
      }, 1000);
      // A7修复：NativeBridge 是 Java 桥接对象（非 NativeApp）
      window.NativeBridge.startRecording();
    };
    // 权限检查通过后直接录音（Java 层自带权限检查）
    doRecord();
  };

  window.stopRecording = function() {
    if (!isRecording) return;
    isRecording = false; micBtn.classList.remove('recording');
    clearInterval(voiceTimer); var seconds = voiceSeconds;
    overlay.style.display = 'none';
    if (seconds < 1) { showToast('录音时间太短'); return; }
    showToast('处理中…');
    // A7：_recordingResult 回调 (base64, filePath) — base64 用于 localStorage 持久化，
    // filePath 传给 NativeBridge.playAudio 原生播放（WebView <audio> 不支持 AMR）
    window._recordingResult = function(audioB64, filePath) {
      if (!audioB64) { showToast('录音处理失败'); return; }
      var audioSrc = 'data:audio/amr;base64,' + audioB64;
      appendVoiceBubble(seconds, audioSrc, filePath);
    };
    window.NativeBridge.stopRecording();
  };

  // A7修复：语音气泡 — base64Audio 用于 localStorage 持久化，filePath 用于 NativeBridge 播放
  function appendVoiceBubble(seconds, base64Audio, filePath) {
    window.appendVoiceBubble = appendVoiceBubble;
    var list = document.getElementById('messageList');
    if (!list) return;
    var row = document.createElement('div');
    row.className = 'msg-row me voice-msg';
    row.setAttribute('data-voice-src', base64Audio);
    row.setAttribute('data-voice-file', filePath || '');
    row.setAttribute('data-voice-seconds', seconds);
    row.setAttribute('data-voice-time', Date.now());
    row.innerHTML =
      '<div class="msg-avatar user">我</div>' +
      '<div class="bubble me voice-bubble" style="padding:8px 14px;display:flex;align-items:center;gap:8px;cursor:pointer;min-width:80px;">' +
      '<span class="voice-play" style="font-size:16px;color:#F472B6;">▶</span>' +
      '<span class="voice-time" style="font-size:13px;color:#3A2030;min-width:30px;">' + seconds + '"</span>' +
      '</div>';
    list.appendChild(row);
    list.scrollTo({ top: list.scrollHeight, behavior: 'smooth' });
    // 保存到 localStorage（仅存 base64，filePath 在 App 重启后失效）
    try {
      var msgs = JSON.parse(localStorage.getItem(VOICE_KEY) || '[]');
      msgs.push({ seconds: seconds, src: base64Audio, time: Date.now() });
      if (msgs.length > 20) msgs = msgs.slice(-20);
      localStorage.setItem(VOICE_KEY, JSON.stringify(msgs));
    } catch(e) {}
  };


  // A7修复：加载已保存语音 — 用时间戳去重，不要求列表为空
  function loadSavedVoices() {
    try {
      var msgs = JSON.parse(localStorage.getItem(VOICE_KEY) || '[]');
      if (!msgs.length) return;
      var list = document.getElementById('messageList');
      if (!list) return;
      // 收集已有语音的时间戳用于去重
      var existingTimes = new Set();
      list.querySelectorAll('.voice-msg').forEach(function(row) {
        var t = row.getAttribute('data-voice-time');
        if (t) existingTimes.add(parseInt(t));
      });
      msgs.forEach(function(m) {
        if (!existingTimes.has(m.time)) {
          appendVoiceBubble(m.seconds, m.src);
        }
      });
    } catch(e) {}
  }
  setTimeout(loadSavedVoices, 500);

  // A7修复：消息列表事件委托 — 语音气泡点击用 NativeBridge 原生播放（WebView 不支持 AMR）
  (function() {
    var list = document.getElementById('messageList');
    if (!list) return;
    var activeVoiceRow = null;
    window._voicePlayEnded = function() {
      if (activeVoiceRow) {
        var icon = activeVoiceRow.querySelector('.voice-play');
        if (icon) icon.textContent = '\u25B6';
        activeVoiceRow = null;
      }
    };
    list.addEventListener('click', function(e) {
      var el = e.target;
      while (el && el !== list) {
        if (el.classList && el.classList.contains('voice-bubble')) break;
        el = el.parentElement;
      }
      if (!el || el === list) return;
      var bubble = el;
      var row = bubble;
      while (row && row !== list) {
        if (row.classList && row.classList.contains('voice-msg')) break;
        row = row.parentElement;
      }
      if (!row || row === list) return;
      var playIcon = bubble.querySelector('.voice-play');
      // A7：优先用 base64 data URL（不依赖临时文件），降级用 filePath
      var audioData = row.getAttribute('data-voice-src') || row.getAttribute('data-voice-file') || '';
      var filePath = row.getAttribute('data-voice-file');
      // 如果已在播放，停止
      if (activeVoiceRow === row) {
        if (window.NativeBridge && window.NativeBridge.stopAudio) {
          window.NativeBridge.stopAudio();
        }
        if (playIcon) playIcon.textContent = '\u25B6';
        activeVoiceRow = null;
        return;
      }
      // 停止其他播放
      if (activeVoiceRow) {
        var prevIcon = activeVoiceRow.querySelector('.voice-play');
        if (prevIcon) prevIcon.textContent = '\u25B6';
        if (window.NativeBridge && window.NativeBridge.stopAudio) {
          window.NativeBridge.stopAudio();
        }
      }
      // 用 NativeBridge 原生播放（支持 base64 和 filePath）
      if (audioData && window.NativeBridge && window.NativeBridge.playAudio) {
        window.NativeBridge.playAudio(audioData);
        activeVoiceRow = row;
        if (playIcon) playIcon.textContent = '\u23F8';
      } else if (row.querySelector('audio')) {
        // 降级：尝试 <audio> 元素播放
        var audio = row.querySelector('audio');
        if (audio.paused) {
          audio.play();
          if (playIcon) playIcon.textContent = '\u23F8';
          audio.onended = function() { if (playIcon) playIcon.textContent = '\u25B6'; };
        }
      }
    });
  })();
})();
</script>
</body>
