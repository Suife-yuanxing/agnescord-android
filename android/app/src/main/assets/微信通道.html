<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">

<link rel="stylesheet" href="shared/base.css">
<link rel="stylesheet" href="shared/components.css">
<link rel="stylesheet" href="shared/anime-cat.css">

<style>
/* ===== 微信通道 — 页面专属样式 ===== */
.scroll-area { padding: 12px 0 8px; }
/* P6：与其他页面相同的顶部间距（由 base.css 统一管理） */

/* 未绑定状态卡片 — 暖灰调 */
.status-card {
  margin: 8px 20px; padding: 18px 16px;
  background: linear-gradient(135deg, #B0A8C0 0%, #C8C0D8 50%, #D8D0E8 100%);
  border-radius: 18px; color: #fff;
  box-shadow: 0 8px 24px rgba(160,150,180,0.25);
  display: flex; align-items: center; gap: 14px;
  position: relative; overflow: hidden;
}
.status-card::after {
  content: ''; position: absolute; top: -30%; left: -30%;
  width: 80%; height: 100%;
  background: radial-gradient(ellipse, rgba(255,255,255,0.12) 0%, transparent 70%);
  pointer-events: none;
}
.status-card .sc-icon {
  width: 44px; height: 44px; border-radius: 50%;
  background: rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center;
  position: relative; z-index: 1;
}
.status-card .sc-icon svg { width: 26px; height: 26px; }
.status-card .sc-info { position: relative; z-index: 1; }
.status-card .sc-label { font-size: 13px; font-weight: 700; }
.status-card .sc-detail { font-size: 11px; opacity: 0.8; margin-top: 2px; }
.status-card .sc-badge {
  position: relative; z-index: 1; margin-left: auto;
  background: rgba(255,255,255,0.2); border: 1.5px solid rgba(255,255,255,0.3);
  padding: 6px 14px; border-radius: 12px;
  font-size: 12px; font-weight: 700;
}

/* 功能介绍卡片 */
.feature-card {
  margin: 6px 20px; padding: 16px;
  background: rgba(255,255,255,0.7); backdrop-filter: blur(8px);
  border-radius: 18px;
  border: 1.5px solid rgba(255,255,255,0.7);
  box-shadow: 0 3px 12px rgba(100,100,120,0.05);
}
.feature-card .fc-title {
  font-size: 15px; font-weight: 700; color: #3A2030; margin-bottom: 12px;
}
.feature-item {
  display: flex; align-items: flex-start; gap: 10px; padding: 10px 0;
}
.feature-item + .feature-item { border-top: 1px solid rgba(0,0,0,0.04); }
.feature-item .fi-icon {
  width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  margin-top: 2px;
}
.fi-green { background: rgba(76,175,80,0.1); color: #4CAF50; }
.fi-pink { background: rgba(244, 114, 182,0.1); color: #F472B6; }
.fi-purple { background: rgba(124,92,191,0.1); color: #C4B5FD; }
.fi-orange { background: rgba(255,179,71,0.1); color: #FFB347; }
.feature-item .fi-icon svg { width: 16px; height: 16px; }
.feature-item .fi-text { flex: 1; }
.feature-item .fi-title { font-size: 13px; font-weight: 700; color: #3A2030; }
.feature-item .fi-desc { font-size: 11px; color: #B090A0; margin-top: 1px; }

/* 绑定步骤卡片 */
.bind-card {
  margin: 6px 20px; padding: 20px 16px;
  background: linear-gradient(135deg, rgba(124,92,191,0.06) 0%, rgba(180,150,220,0.1) 100%);
  border-radius: 18px;
  border: 1.5px solid rgba(124,92,191,0.15);
  text-align: center;
}
.bind-card .bind-icon {
  width: 56px; height: 56px; border-radius: 50%;
  background: linear-gradient(135deg, #C4B5FD, #9B7ED8);
  margin: 0 auto 12px; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 18px rgba(124,92,191,0.2);
}
.bind-card .bind-icon svg { width: 28px; height: 28px; color: #fff; }
.bind-card .bind-title { font-size: 16px; font-weight: 800; color: #3A2030; margin-bottom: 4px; }
.bind-card .bind-desc { font-size: 12px; color: #B090A0; margin-bottom: 16px; line-height: 1.5; }
.bind-btn {
  display: inline-block; padding: 12px 40px; border-radius: 14px;
  background: linear-gradient(135deg, #C4B5FD, #9B7ED8);
  color: #fff; border: none; font-size: 15px; font-weight: 700;
  font-family: inherit; cursor: pointer;
  box-shadow: 0 6px 18px rgba(124,92,191,0.25);
  transition: all 0.25s;
}
.bind-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(124,92,191,0.35); }
.bind-btn:active { transform: scale(0.97); }

/* Step indicators */
.steps-row { display: flex; gap: 8px; margin: 6px 20px; }
.step-card {
  flex: 1; background: rgba(255,255,255,0.7); backdrop-filter: blur(8px);
  border-radius: 14px; padding: 12px 8px; text-align: center;
  border: 1.5px solid rgba(255,255,255,0.7);
  box-shadow: 0 3px 12px rgba(100,100,120,0.05);
}
.step-card .st-num {
  width: 24px; height: 24px; border-radius: 50%;
  background: linear-gradient(135deg, #C4B5FD, #9B7ED8);
  color: #fff; font-size: 12px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 6px;
}
.step-card .st-title { font-size: 11px; font-weight: 700; color: #3A2030; }
.step-card .st-desc { font-size: 10px; color: #B090A0; margin-top: 2px; }

/* 自定义确认弹窗 */
.confirm-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center;
  animation: dp-fade-in 0.2s ease;
}
@keyframes dp-fade-in { from { opacity: 0; } to { opacity: 1; } }
.confirm-sheet {
  width: 280px; background: #fff; border-radius: 18px;
  padding: 24px 20px 16px; text-align: center;
  box-shadow: 0 12px 40px rgba(0,0,0,0.15);
  animation: dp-slide-up 0.25s cubic-bezier(0.25, 0.1, 0.25, 1);
}
@keyframes dp-slide-up { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.confirm-sheet .cs-title { font-size: 16px; font-weight: 800; color: #3A2030; margin-bottom: 8px; }
.confirm-sheet .cs-desc { font-size: 13px; color: #B090A0; line-height: 1.6; margin-bottom: 20px; }
.confirm-sheet .cs-actions { display: flex; gap: 10px; }
.confirm-sheet .cs-btn { flex: 1; padding: 12px; border-radius: 12px; font-size: 14px; font-weight: 700; border: none; cursor: pointer; font-family: inherit; transition: all 0.2s; }
.confirm-sheet .cs-cancel { background: rgba(0,0,0,0.04); color: #B090A0; }
.confirm-sheet .cs-cancel:active { transform: scale(0.97); }
.confirm-sheet .cs-confirm { background: linear-gradient(135deg, #C4B5FD, #9B7ED8); color: #fff; box-shadow: 0 4px 12px rgba(124,92,191,0.25); }
.confirm-sheet .cs-confirm:active { transform: scale(0.97); }
.phone.dark-mode .confirm-sheet { background: #1A1A2E; }
.phone.dark-mode .confirm-sheet .cs-title { color: #E0D8E8; }
.phone.dark-mode .confirm-sheet .cs-cancel { background: rgba(255,255,255,0.06); color: #8078A0; }

/* ===== Dark Mode ===== */
.phone.dark-mode .status-card { background: linear-gradient(135deg, #5A5270 0%, #6A6278 50%, #7A7288 100%); box-shadow: 0 8px 24px rgba(90,82,112,0.25); }
.phone.dark-mode .feature-card { background: #16213E; border-color: rgba(255,255,255,0.06); }
.phone.dark-mode .feature-card .fc-title { color: #E0D8E8; }
.phone.dark-mode .feature-item .fi-title { color: #E0D8E8; }
.phone.dark-mode .feature-item .fi-desc { color: #8078A0; }
.phone.dark-mode .feature-item + .feature-item { border-top-color: rgba(255,255,255,0.04); }
.phone.dark-mode .bind-card { background: rgba(124,92,191,0.08); border-color: rgba(124,92,191,0.15); }
.phone.dark-mode .bind-card .bind-title { color: #E0D8E8; }
.phone.dark-mode .bind-card .bind-desc { color: #8078A0; }
.phone.dark-mode .step-card { background: #16213E; border-color: rgba(255,255,255,0.06); }
.phone.dark-mode .step-card .st-title { color: #E0D8E8; }
.phone.dark-mode .step-card .st-desc { color: #8078A0; }
</style>

<script>
// 自定义确认弹窗（替代原生 confirm）
function showConfirm(title, desc, onConfirm) {
  var overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  overlay.innerHTML = '<div class="confirm-sheet">' +
    '<div class="cs-title">' + title + '</div>' +
    '<div class="cs-desc">' + desc + '</div>' +
    '<div class="cs-actions">' +
      '<button class="cs-btn cs-cancel">取消</button>' +
      '<button class="cs-btn cs-confirm">确认绑定</button>' +
    '</div></div>';
  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) { overlay.remove(); return; }
    var btn = e.target.closest('.cs-btn');
    if (!btn) return;
    overlay.remove();
    if (btn.classList.contains('cs-confirm') && onConfirm) onConfirm();
  });
  document.getElementById('phoneFrame').appendChild(overlay);
}

function handleBind() {
  if (!API.isLoggedIn()) { showToast('请先登录', 'error'); return; }
  API.listBots().then(function(r){
    var bots = r.bots || [];
    if (!bots.length) { showToast('请先创建一个 Bot', 'error'); return; }
    var botId = bots[0].id;
    showConfirm('绑定微信通道', '1. 扫码验证身份<br>2. 选择授权范围<br>3. 确认绑定', function() {
      var btn = document.querySelector('.bind-btn');
      btn.textContent = '绑定中...';
      btn.disabled = true;
      btn.style.opacity = '0.7';
      API.bindWechat(botId).then(function(res){
        showToast('微信通道绑定成功！', 'success');
        btn.textContent = '已绑定 ✓';
        btn.style.background = 'linear-gradient(135deg, #4CAF50, #66BB6A)';
        btn.style.boxShadow = '0 6px 18px rgba(76,175,80,0.25)';
        var sc = document.querySelector('.status-card');
        sc.style.background = 'linear-gradient(135deg, #4CAF50 0%, #66BB6A 50%, #81C784 100%)';
        sc.style.boxShadow = '0 8px 24px rgba(76,175,80,0.25)';
        sc.querySelector('.sc-label').textContent = '已连接';
        sc.querySelector('.sc-detail').textContent = '微信 Bot · 运行正常';
        sc.querySelector('.sc-badge').textContent = 'v1.0.0';
        sc.querySelector('.sc-icon svg').innerHTML = '<circle cx="12" cy="12" r="10"/><path d="M7 13l3 3 7-7"/>';
        btn.disabled = false;
        btn.style.opacity = '1';
        if (typeof loadWxStatus === 'function') loadWxStatus();
      }).catch(function(e){
        showToast('绑定失败: ' + e.message, 'error');
        btn.textContent = '立即绑定';
        btn.disabled = false;
        btn.style.opacity = '1';
        // 更新状态卡片为异常状态
        var sc = document.querySelector('.status-card');
        if (sc) {
          sc.style.background = 'linear-gradient(135deg, #FF6B6B 0%, #FF8E8E 50%, #FFB4B4 100%)';
          var detailEl = sc.querySelector('.sc-detail');
          if (detailEl) detailEl.textContent = '服务器异常，请稍后重试';
          var badge = sc.querySelector('.sc-badge');
          if (badge) badge.textContent = '异常';
        }
      });
    });
  }).catch(function(e){
    showToast('获取 Bot 列表失败: ' + e.message, 'error');
  });
}

// Load WeChat channel status
if (API.isLoggedIn()) {
  function loadWxStatus() {
    API.getWechatStatus().then(function(wx) {
      var statusEl = document.querySelector('[data-wx-status]') || document.querySelector('.wx-status');
      if (statusEl) {
        statusEl.textContent = wx.bound ? '已绑定' : '未绑定';
      }
      // 更新状态卡片颜色和细节
      var sc = document.querySelector('.status-card');
      if (sc && wx.bound) {
        sc.style.background = 'linear-gradient(135deg, #4CAF50 0%, #66BB6A 50%, #81C784 100%)';
        sc.style.boxShadow = '0 8px 24px rgba(76,175,80,0.25)';
        var detailEl = sc.querySelector('.sc-detail');
        if (detailEl) detailEl.textContent = '微信 Bot · 运行正常';
        var badge = sc.querySelector('.sc-badge');
        if (badge) badge.textContent = '在线';
      }
      var boundEl = document.querySelector('[data-wx-bound]');
      if (boundEl) boundEl.textContent = wx.bound ? '是' : '否';
    }).catch(function(err) {
      var errMsg = err.message || '未知错误';
      console.error('[WeChat] status error:', errMsg, err);
      // 显示实际错误信息
      var statusEl = document.querySelector('[data-wx-status]');
      if (statusEl) statusEl.textContent = '服务异常';
      var sc = document.querySelector('.status-card');
      if (sc) {
        sc.style.background = 'linear-gradient(135deg, #FF6B6B 0%, #FF8E8E 50%, #FFB4B4 100%)';
        var detailEl = sc.querySelector('.sc-detail');
        if (detailEl) detailEl.textContent = errMsg;
      }
      var badge = sc && sc.querySelector('.sc-badge');
      if (badge) badge.textContent = '异常';
      // 显示后端配置引导
      showWxBackendGuidance(errMsg);
    });
  }
  loadWxStatus();
}

// 后端配置引导 — 当接口不可用时显示
function showWxBackendGuidance(errMsg) {
  var existing = document.getElementById('backendGuidance');
  if (existing) existing.remove();
  var serverBase = (window.APP_CONFIG && window.APP_CONFIG.server_base) || '未配置';
  var guidance = document.createElement('div');
  guidance.id = 'backendGuidance';
  guidance.style.cssText = 'margin:12px 20px;padding:16px;background:rgba(255,255,255,0.85);backdrop-filter:blur(8px);border-radius:16px;border:1.5px solid rgba(255,107,107,0.2);';
  guidance.innerHTML = '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">' +
    '<div style="width:28px;height:28px;border-radius:50%;background:rgba(255,107,107,0.1);display:flex;align-items:center;justify-content:center;">' +
    '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#FF6B6B" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' +
